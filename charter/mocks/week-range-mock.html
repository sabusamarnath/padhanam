<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Week — custom range</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-sans:'Plus Jakarta Sans',system-ui,sans-serif;
    --ink-1:#1c1c1a;--ink-2:#5f5e5a;--ink-3:#888780;
    --page:#eceef0;--surface:#ffffff;--surface-2:#f5f5f3;
    --hairline:rgba(26,26,25,0.12);--hairline-strong:rgba(26,26,25,0.20);
    --navy:#2e3264;--teal:#1a8070;
    --on_track:#3b6d11;--needs:#534ab7;--behind:#854f0b;--risk:#a32d2d;--done:#888780;
    --cool:#7a8190;--warm:#b0997e;
    --radius:9px;--radius-input:6px;
  }
  [data-theme="dark"]{
    --ink-1:#f0eeea;--ink-2:#b4b2a9;--ink-3:#888780;
    --page:#161614;--surface:#222220;--surface-2:#1c1c1a;
    --hairline:rgba(240,238,234,0.12);--hairline-strong:rgba(240,238,234,0.22);
    --navy:#3b4080;--teal:#2ba692;
    --on_track:#8ea868;--needs:#9f9ad0;--behind:#d3a05a;--risk:#d68e8e;--done:#8a8980;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-sans);font-size:14px;color:var(--ink-1);background:var(--page);-webkit-font-smoothing:antialiased;}
  .topbar{height:50px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:20;}
  .brand{font-size:13px;font-weight:600;} .spacer{flex:1;}
  .tbtn{padding:6px;display:grid;place-items:center;color:var(--ink-2);background:none;border:1px solid var(--hairline-strong);border-radius:var(--radius-input);cursor:pointer;} .tbtn:hover{color:var(--ink-1);} .tbtn svg{width:17px;height:17px;}

  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 50px;}
  h1{font-size:21px;font-weight:600;letter-spacing:-0.01em;}
  .ranges{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:16px 0 6px;}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-input);padding:3px;gap:3px;}
  .seg button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);background:none;border:none;border-radius:4px;padding:6px 13px;cursor:pointer;}
  .seg button.on{background:var(--surface);color:var(--ink-1);box-shadow:0 1px 2px rgba(0,0,0,0.08);}
  .custom,.anchor{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);}
  .custom input,.anchor input,.anchor select{font:inherit;font-size:13px;color:var(--ink-1);background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--radius-input);padding:5px 8px;}
  .custom input{width:54px;}
  .custom button{font:inherit;font-size:12px;font-weight:600;color:var(--ink-1);background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--radius-input);padding:5px 11px;cursor:pointer;}
  .progress{font-size:12.5px;font-weight:600;color:var(--ink-1);margin:4px 2px 2px;}
  .progress b{color:var(--teal);}
  .info{font-size:12px;color:var(--ink-3);margin:2px 2px 12px;}

  .matrixwrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--radius);background:var(--surface);}
  .matrix{display:grid;min-width:min-content;}
  .corner,.mh,.lh,.cell{border-bottom:1px solid var(--hairline);border-right:1px solid var(--hairline);}
  .corner,.lh{position:sticky;left:0;background:var(--surface);z-index:2;}
  .corner{z-index:3;}
  .mh{padding:9px 6px;text-align:center;background:var(--surface);}
  .mh .wd{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-3);}
  .mh .dd{font-size:13px;font-weight:600;margin-top:1px;}
  .mh.today .dd{color:var(--teal);} .mh.today{background:color-mix(in srgb,var(--teal) 8%,var(--surface));}
  .lh{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;font-weight:600;}
  .lh svg{width:15px;height:15px;color:var(--tint);}
  .cell{padding:7px 6px;min-height:52px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;cursor:pointer;}
  .cell:hover{background:var(--surface-2);} .cell.sel{background:color-mix(in srgb,var(--teal) 9%,transparent);}
  .cell.todaycol{background:color-mix(in srgb,var(--teal) 5%,transparent);}

  .chip{display:inline-flex;align-items:center;gap:2px;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--st) 14%,transparent);color:var(--st);font-size:10px;font-weight:700;}
  .chip svg{width:12px;height:12px;}
  .bucket{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;border-radius:6px;background:color-mix(in srgb,var(--st) 20%,transparent);color:var(--st);font-size:13px;font-weight:700;border:1px solid color-mix(in srgb,var(--st) 35%,transparent);}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--ink-2);}
  .legend span{display:inline-flex;align-items:center;gap:6px;} .legend i{width:9px;height:9px;border-radius:2px;}

  .expand{margin-top:16px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:6px 16px;display:none;}
  .expand.open{display:block;}
  .eh{padding:11px 0;border-bottom:1px solid var(--hairline);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-3);}
  .erow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--hairline);}
  .erow:last-child{border-bottom:none;} .erow .et{flex:1;font-size:14px;font-weight:500;}
  .erow .ed{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-3);}
  .pill{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;padding:3px 9px;border-radius:9999px;}
  .pill.on_track{background:color-mix(in srgb,var(--on_track) 16%,transparent);color:var(--on_track);}
  .pill.needs{background:color-mix(in srgb,var(--needs) 16%,transparent);color:var(--needs);}
  .pill.behind{background:color-mix(in srgb,var(--behind) 16%,transparent);color:var(--behind);}
  .pill.risk{background:color-mix(in srgb,var(--risk) 16%,transparent);color:var(--risk);}
  .pill.done{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done);}
</style>
</head>
<body>
  <div class="topbar"><span class="brand">Padhanam · Week</span><div class="spacer"></div><button class="tbtn" id="themeToggle"></button></div>
  <div class="wrap">
    <h1>Week</h1>
    <div class="ranges">
      <div class="seg" id="rangeSeg">
        <button data-r="r7" class="on">Rolling 7d</button>
        <button data-r="r10">10 days</button>
        <button data-r="quarter">Quarter</button>
        <button data-r="h100">100 days</button>
      </div>
      <span class="custom">Custom <input id="customN" type="number" min="1" max="180" value="14" /> days <button id="customGo">Go</button></span>
      <span id="anchorCtrl"></span>
    </div>
    <div class="progress" id="progress"></div>
    <div class="info" id="info"></div>
    <div class="matrixwrap"><div class="matrix" id="matrix"></div></div>
    <div class="legend">
      <span><i style="background:var(--risk)"></i>At risk</span><span><i style="background:var(--behind)"></i>Behind</span>
      <span><i style="background:var(--needs)"></i>Needs you</span><span><i style="background:var(--on_track)"></i>On track</span>
      <span style="color:var(--ink-3)">In long views a cell shows how many items fall that week, coloured by the worst.</span>
    </div>
    <div class="expand" id="expand"></div>
  </div>

<script>
  const I={
    work:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-9.5A3.5 3.5 0 0 1 12 7a3.5 3.5 0 0 1 7 3.5C19 15.5 12 20 12 20z"/></svg>',
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>',
    friends:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.6a3 3 0 0 1 0 5.4"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8 8 0 1 1 11.2 3a6 6 0 0 0 9.8 9.8z"/></svg>',
  };
  const LANES=[{k:'work',label:'Work',tint:'var(--cool)',icon:I.work},{k:'health',label:'Health',tint:'var(--warm)',icon:I.heart},{k:'family',label:'Family',tint:'var(--warm)',icon:I.home},{k:'friends',label:'Friends',tint:'var(--warm)',icon:I.friends}];
  const SL={on_track:'On track',needs:'Needs you',behind:'Behind',risk:'At risk',done:'Done'};
  const RANK={done:1,on_track:2,needs:3,behind:4,risk:5};
  const DAY=864e5, base=new Date(2026,5,4); // today: Wed 4 Jun 2026
  const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dateFor(off){ const d=new Date(base); d.setDate(d.getDate()+off); return d; }
  function dlabel(off){ const d=dateFor(off); return WD[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]; }
  function mlabel(off){ const d=dateFor(off); return MO[d.getMonth()]+' '+d.getDate(); }
  function offOf(d){ return Math.round((d-base)/DAY); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  const ITEMS=[
    // earlier in the period (past)
    {off:-58,lane:'work',init:'H',status:'done',title:'Helios contract signed'},
    {off:-44,lane:'work',init:'V',status:'done',title:'Vertex onboarding'},
    {off:-30,lane:'work',init:'N',status:'done',title:'Northwind status pack'},
    {off:-21,lane:'health',init:'BM',status:'on_track',title:'Training block starts'},
    {off:-14,lane:'family',init:'',status:'done',title:'School play'},
    {off:-7,lane:'work',init:'A',status:'done',title:'Aurora SOW agreed'},
    // near term
    {off:0,lane:'work',init:'',status:'risk',title:'Approve security policy'},
    {off:0,lane:'work',init:'H',status:'needs',title:'Helios SOW change request'},
    {off:0,lane:'work',init:'',status:'needs',title:'1:1 with Priya'},
    {off:0,lane:'health',init:'',status:'needs',title:'Dentist'},
    {off:1,lane:'health',init:'BM',status:'on_track',title:'Tempo run'},
    {off:2,lane:'work',init:'H',status:'risk',title:'Helios SOW submission'},
    {off:2,lane:'work',init:'V',status:'needs',title:'Vertex sign-off'},
    {off:2,lane:'family',init:'',status:'needs',title:"Aanya's recital"},
    {off:3,lane:'friends',init:'',status:'needs',title:'Call Sam'},
    {off:4,lane:'work',init:'A',status:'needs',title:'Aurora kickoff'},
    {off:5,lane:'health',init:'BM',status:'on_track',title:'Long run 16mi'},
    {off:7,lane:'work',init:'N',status:'behind',title:'Northwind status pack'},
    {off:9,lane:'work',init:'H',status:'needs',title:'Helios change-request review'},
    {off:12,lane:'health',init:'BM',status:'on_track',title:'Long run 18mi'},
    {off:14,lane:'family',init:'',status:'needs',title:'Parents evening'},
    {off:19,lane:'health',init:'BM',status:'needs',title:'Long run 20mi'},
    {off:21,lane:'friends',init:'',status:'on_track',title:'Dinner with Sam'},
    {off:26,lane:'health',init:'BM',status:'on_track',title:'Long run (taper)'},
    {off:30,lane:'family',init:'',status:'on_track',title:'Half-term trip'},
    {off:37,lane:'work',init:'N',status:'needs',title:'Northwind status pack'},
    {off:40,lane:'work',init:'A',status:'on_track',title:'Aurora phase 1'},
    {off:45,lane:'work',init:'H',status:'needs',title:'Helios mid-contract review'},
    {off:54,lane:'health',init:'BM',status:'on_track',title:'Long run'},
    {off:60,lane:'family',init:'',status:'on_track',title:'Birthday'},
    {off:67,lane:'work',init:'N',status:'needs',title:'Northwind status pack'},
    {off:75,lane:'health',init:'BM',status:'needs',title:'Long run'},
    {off:88,lane:'work',init:'H',status:'risk',title:'Helios Q3 renewal decision'},
    {off:88,lane:'work',init:'',status:'needs',title:'Quarter business review'},
    {off:90,lane:'health',init:'BM',status:'risk',title:'Wide World Marathon race day'},
  ];

  // range carries an explicit start (Date) and startOff (days from base). Rolling => start=today.
  let range={key:'r7',days:7,mode:'day',startOff:0}, sel=null;
  let qStartOff=offOf(new Date(base.getFullYear(),Math.floor(base.getMonth()/3)*3,1)); // current quarter start
  let h100StartOff=0, customStartOff=0, customDays=14;

  function deriveMode(d){ return d<=14?'day':'week'; }
  function quarterDaysFrom(off){ const sd=dateFor(off), e=new Date(sd); e.setMonth(e.getMonth()+3); return Math.round((e-sd)/DAY); }

  function applyRange(){
    if(range.key==='r7'){ range.startOff=0; range.days=7; range.mode='day'; }
    else if(range.key==='r10'){ range.startOff=0; range.days=10; range.mode='day'; }
    else if(range.key==='custom'){ range.startOff=customStartOff; range.days=customDays; range.mode=deriveMode(customDays); }
    else if(range.key==='quarter'){ range.startOff=qStartOff; range.days=quarterDaysFrom(qStartOff); range.mode='week'; }
    else if(range.key==='h100'){ range.startOff=h100StartOff; range.days=100; range.mode='week'; }
    sel=null; renderAnchor(); render();
  }

  function renderAnchor(){
    const el=document.getElementById('anchorCtrl'), k=range.key;
    if(k==='quarter'||k==='h100'||k==='custom'){
      const off = k==='quarter'?qStartOff : k==='h100'?h100StartOff : customStartOff;
      el.innerHTML='<span class="anchor">Start date <input type="date" id="startDate" value="'+iso(dateFor(off))+'" /></span>';
      document.getElementById('startDate').addEventListener('change',e=>{ if(!e.target.value) return; const o=offOf(new Date(e.target.value+'T00:00:00'));
        if(k==='quarter') qStartOff=o; else if(k==='h100') h100StartOff=o; else customStartOff=o; applyRange(); });
    } else el.innerHTML='';
  }

  function chip(it){ return '<span class="chip" style="--st:var(--'+it.status+')">'+LANES.find(l=>l.k===it.lane).icon+(it.init?'<span>'+it.init+'</span>':'')+'</span>'; }
  function worst(items){ let w=null,r=0; items.forEach(it=>{const k=RANK[it.status]||0; if(k>r){r=k;w=it.status;}}); return w; }

  const matrix=document.getElementById('matrix');
  function render(){
    const {days,mode,startOff}=range;
    const todayWO = 0 - startOff;                 // today's offset within the window
    const todayWeek = Math.floor(todayWO/7);
    let cols=[];
    if(mode==='day'){ for(let o=0;o<days;o++) cols.push({type:'day',wo:o}); }
    else { const wks=Math.ceil(days/7); for(let w=0;w<wks;w++) cols.push({type:'week',wk:w}); }
    const colW = mode==='day'?98:72;
    matrix.style.gridTemplateColumns='132px repeat('+cols.length+','+colW+'px)';

    let html='<div class="corner"></div>';
    cols.forEach(c=>{
      if(c.type==='day'){ const off=startOff+c.wo, isT=(off===0); const d=dateFor(off);
        html+='<div class="mh'+(isT?' today':'')+'"><div class="wd">'+WD[d.getDay()]+'</div><div class="dd">'+d.getDate()+'</div></div>'; }
      else { const isT=(c.wk===todayWeek && todayWO>=0 && todayWO<days);
        html+='<div class="mh'+(isT?' today':'')+'"><div class="wd">Wk</div><div class="dd">'+mlabel(startOff+c.wk*7)+'</div></div>'; }
    });
    LANES.forEach(lane=>{
      html+='<div class="lh" style="--tint:'+lane.tint+'">'+lane.icon+'<span>'+lane.label+'</span></div>';
      cols.forEach(c=>{
        let items, key, isToday;
        if(c.type==='day'){ const off=startOff+c.wo; items=ITEMS.filter(it=>it.lane===lane.k && it.off===off); key='d'+c.wo; isToday=(off===0); }
        else { items=ITEMS.filter(it=>{ const wo=it.off-startOff; return it.lane===lane.k && wo>=0 && wo<days && Math.floor(wo/7)===c.wk; }); key='w'+c.wk; isToday=(c.wk===todayWeek && todayWO>=0 && todayWO<days); }
        const seld = sel && sel.lane===lane.k && sel.key===key;
        let inner='';
        if(items.length){ if(mode==='day') inner=items.map(chip).join(''); else { const w=worst(items); inner='<span class="bucket" style="--st:var(--'+w+')">'+items.length+'</span>'; } }
        html+='<div class="cell'+(seld?' sel':'')+(isToday?' todaycol':'')+'" data-lane="'+lane.k+'" data-key="'+key+'" data-type="'+c.type+'" data-col="'+(c.type==='day'?c.wo:c.wk)+'">'+inner+'</div>';
      });
    });
    matrix.innerHTML=html;
    matrix.querySelectorAll('.cell').forEach(cell=>cell.addEventListener('click',()=>{
      const lane=cell.dataset.lane, key=cell.dataset.key;
      sel=(sel&&sel.lane===lane&&sel.key===key)?null:{lane,key,type:cell.dataset.type,col:+cell.dataset.col};
      render();
    }));
    renderProgress(); renderExpand();
  }

  function renderProgress(){
    const p=document.getElementById('progress'), info=document.getElementById('info');
    const {days,mode,startOff}=range; const todayWO=0-startOff; const inWin=todayWO>=0&&todayWO<days;
    let prog='', label='';
    if(range.key==='h100'){ label='100 days from '+mlabel(startOff);
      prog=inWin?'<b>Day '+(todayWO+1)+' of 100</b> · '+(99-todayWO)+' to go':'Window does not include today'; }
    else if(range.key==='quarter'){ const totWk=Math.ceil(days/7); label='Quarter · '+mlabel(startOff)+' to '+mlabel(startOff+days-1);
      prog=inWin?'<b>Week '+(Math.floor(todayWO/7)+1)+' of '+totWk+'</b>':'Window does not include today'; }
    else if(range.key==='custom'){ label=(startOff!==0?'Custom '+days+' days from '+mlabel(startOff):'Next '+days+' days'); prog=''; }
    else { prog=''; label=(range.key==='r7'?'Rolling 7 days from today':'Next 10 days'); }
    p.innerHTML=prog; p.style.display=prog?'block':'none';
    info.textContent=label+' · '+(mode==='day'?'day columns':'by week, today highlighted');
  }

  function renderExpand(){
    const ex=document.getElementById('expand'); const {startOff,days}=range;
    if(!sel){ ex.classList.remove('open'); return; }
    const lane=LANES.find(l=>l.k===sel.lane); let items, head;
    if(sel.type==='day'){ const off=startOff+sel.col; items=ITEMS.filter(it=>it.lane===sel.lane && it.off===off); head=lane.label+' · '+dlabel(off); }
    else { items=ITEMS.filter(it=>{ const wo=it.off-startOff; return it.lane===sel.lane && wo>=0 && wo<days && Math.floor(wo/7)===sel.col; }).sort((a,b)=>a.off-b.off); head=lane.label+' · week of '+mlabel(startOff+sel.col*7); }
    if(!items.length){ ex.classList.remove('open'); return; }
    ex.innerHTML='<div class="eh">'+head+'</div>'+items.map(it=>
      '<div class="erow"><span class="et">'+(it.init?it.init+': ':'')+it.title+'</span><span class="ed">'+dlabel(it.off)+'</span><span class="pill '+it.status+'">'+SL[it.status]+'</span></div>').join('');
    ex.classList.add('open');
  }

  document.getElementById('rangeSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#rangeSeg button').forEach(x=>x.classList.toggle('on',x===b)); range.key=b.dataset.r; applyRange(); });
  document.getElementById('customGo').addEventListener('click',()=>{ customDays=Math.max(1,Math.min(180,+document.getElementById('customN').value||14));
    document.querySelectorAll('#rangeSeg button').forEach(x=>x.classList.remove('on')); range.key='custom'; applyRange(); });

  function updateThemeBtn(){ const tb=document.getElementById('themeToggle'); const dark=document.documentElement.getAttribute('data-theme')==='dark';
    tb.innerHTML=dark?I.sun:I.moon; tb.title=dark?'Switch to light mode':'Switch to dark mode'; }
  document.getElementById('themeToggle').addEventListener('click',()=>{ const d=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',d?'light':'dark'); updateThemeBtn(); });

  updateThemeBtn(); applyRange();
</script>
</body>
</html>
