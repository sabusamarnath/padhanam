<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Journal — Today rail and standalone</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-sans:'Plus Jakarta Sans',system-ui,sans-serif;
    --ink-1:#1c1c1a;--ink-2:#5f5e5a;--ink-3:#888780;
    --page:#eceef0;--surface:#ffffff;--surface-2:#f5f5f3;--surface-personal:#faf6ec;
    --journal-bg:#f7f1e3;--journal-line:rgba(120,100,70,0.18);
    --hairline:rgba(26,26,25,0.12);--hairline-strong:rgba(26,26,25,0.20);
    --navy:#2e3264;--navy-hover:#262a55;--teal:#1a8070;
    --on_track:#3b6d11;--needs:#534ab7;--behind:#854f0b;--risk:#a32d2d;
    --cool:#7a8190;--warm:#b0997e;--ochre:#9a7b3f;
    --radius:10px;--radius-input:6px;
  }
  [data-theme="dark"]{
    --ink-1:#f0eeea;--ink-2:#b4b2a9;--ink-3:#888780;
    --page:#161614;--surface:#222220;--surface-2:#1c1c1a;--surface-personal:#262320;
    --journal-bg:#24201a;--journal-line:rgba(200,170,120,0.16);
    --hairline:rgba(240,238,234,0.12);--hairline-strong:rgba(240,238,234,0.22);
    --navy:#3b4080;--navy-hover:#464c95;--teal:#2ba692;
    --on_track:#8ea868;--needs:#9f9ad0;--behind:#d3a05a;--risk:#d68e8e;--warm:#b0997e;--ochre:#d3a05a;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-sans);font-size:14px;color:var(--ink-1);background:var(--page);-webkit-font-smoothing:antialiased;}
  .topbar{height:50px;display:flex;align-items:center;gap:16px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:10;}
  .topbar .brand{font-size:13px;font-weight:600;}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-input);padding:3px;gap:3px;}
  .seg button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);background:none;border:none;border-radius:4px;padding:6px 15px;cursor:pointer;}
  .seg button.on{background:var(--surface);color:var(--ink-1);box-shadow:0 1px 2px rgba(0,0,0,0.08);}
  .spacer{flex:1;}
  .tbtn{padding:6px;display:grid;place-items:center;color:var(--ink-2);background:none;border:1px solid var(--hairline-strong);border-radius:var(--radius-input);cursor:pointer;}
  .tbtn:hover{color:var(--ink-1);} .tbtn svg{width:17px;height:17px;}

  /* TODAY split */
  .today{display:grid;grid-template-columns:1fr 372px;gap:0;}
  @media (max-width:840px){ .today{grid-template-columns:1fr;} }
  .todaymain{padding:24px 26px 50px;max-width:560px;margin-left:auto;}
  h1{font-size:21px;font-weight:600;letter-spacing:-0.01em;} .date{font-size:13px;color:var(--ink-2);margin-top:2px;}
  .sec-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-3);margin:20px 0 11px;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--radius-input);border:1px solid var(--hairline);background:var(--surface);}
  .row[data-tier="personal"]{background:var(--surface-personal);}
  .cue{flex-shrink:0;display:inline-flex;align-items:center;gap:2px;color:var(--tint);} .cue svg{width:16px;height:16px;} .cue .ci{font-size:9px;font-weight:700;}
  .row .body{flex:1;min-width:0;} .row .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .m{font-size:12px;color:var(--ink-3);margin-top:1px;}
  .pill{flex-shrink:0;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;padding:3px 9px;border-radius:9999px;}
  .pill.on_track{background:color-mix(in srgb,var(--on_track) 16%,transparent);color:var(--on_track);}
  .pill.needs{background:color-mix(in srgb,var(--needs) 16%,transparent);color:var(--needs);}
  .pill.behind{background:color-mix(in srgb,var(--behind) 16%,transparent);color:var(--behind);}
  .pill.risk{background:color-mix(in srgb,var(--risk) 16%,transparent);color:var(--risk);}

  /* JOURNAL panel (warm) */
  .jrail{background:var(--journal-bg);border-left:1px solid var(--journal-line);min-height:calc(100vh - 50px);padding:24px 24px 50px;}
  .journal{max-width:620px;margin:0 auto;}
  .jhead{display:flex;align-items:baseline;justify-content:space-between;}
  .jhead .jt{font-size:16px;font-weight:600;letter-spacing:-0.01em;} .jhead .jd{font-size:12px;color:var(--ink-3);}
  .jblock-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ochre);margin:20px 0 9px;}
  .seedlist{display:flex;flex-direction:column;gap:7px;}
  .seed{display:flex;align-items:center;gap:10px;padding:9px 11px;background:color-mix(in srgb,var(--journal-bg) 60%,var(--surface));border:1px solid var(--journal-line);border-radius:var(--radius-input);}
  .seed .sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .seed .stx{flex:1;font-size:13px;color:var(--ink-1);}
  .seed .sadd{flex-shrink:0;font:inherit;font-size:11px;font-weight:600;color:var(--ochre);background:none;border:1px solid color-mix(in srgb,var(--ochre) 40%,transparent);border-radius:4px;padding:3px 9px;cursor:pointer;}
  .seed.added .sadd{color:var(--ink-3);border-color:var(--hairline-strong);}
  .jprompt{font-size:12.5px;color:var(--ink-2);font-style:italic;margin:20px 0 9px;}
  .jwrite{width:100%;min-height:200px;font:inherit;font-size:14.5px;line-height:1.7;color:var(--ink-1);background:transparent;border:none;outline:none;resize:vertical;
    background-image:repeating-linear-gradient(var(--journal-bg),var(--journal-bg) 31px,var(--journal-line) 31px,var(--journal-line) 32px);}
  .jwrite::placeholder{color:var(--ink-3);}
  .jfoot{display:flex;align-items:center;gap:12px;margin-top:16px;}
  .jsave{font:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--navy);border:none;border-radius:var(--radius-input);padding:9px 18px;cursor:pointer;}
  .jsave:hover{background:var(--navy-hover);}
  .jsaved{font-size:12px;color:var(--ink-3);display:none;} .jsaved.show{display:inline;}

  /* STANDALONE journal */
  .standalone{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 50px);}
  @media (max-width:840px){ .standalone{grid-template-columns:1fr;} .entries{display:none;} }
  .entries{border-right:1px solid var(--hairline);padding:20px 14px;background:var(--surface);}
  .entries .eh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-3);padding:0 8px 10px;}
  .eitem{padding:10px 10px;border-radius:var(--radius-input);cursor:pointer;}
  .eitem:hover{background:var(--surface-2);} .eitem.on{background:color-mix(in srgb,var(--navy) 10%,transparent);}
  .eitem .ed{font-size:12.5px;font-weight:600;} .eitem .es{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .standmain{background:var(--journal-bg);padding:30px 30px 50px;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Padhanam</span>
    <div class="seg" id="viewSeg"><button data-v="today" class="on">Today</button><button data-v="journal">Journal</button></div>
    <div class="spacer"></div>
    <button class="tbtn" id="themeToggle"></button>
  </div>
  <div id="root"></div>

<script>
  const I={
    work:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-9.5A3.5 3.5 0 0 1 12 7a3.5 3.5 0 0 1 7 3.5C19 15.5 12 20 12 20z"/></svg>',
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8 8 0 1 1 11.2 3a6 6 0 0 0 9.8 9.8z"/></svg>',
  };
  const TIER={work:{tint:'var(--cool)',tier:'work',icon:I.work},health:{tint:'var(--warm)',tier:'personal',icon:I.heart},family:{tint:'var(--warm)',tier:'personal',icon:I.home}};
  const SL={on_track:'On track',needs:'Needs you',behind:'Behind',risk:'At risk'};
  const TODAY=[
    {cat:'work',init:'',title:'Approve security policy',m:'Internal · overdue',status:'risk'},
    {cat:'work',init:'H',title:'SOW change request',m:'Helios · Friday',status:'needs'},
    {cat:'work',init:'',title:'1:1 with Priya',m:'2:00pm',status:'needs'},
    {cat:'health',init:'',title:'Dentist, 4:30pm',m:'Personal',status:'needs'},
    {cat:'family',init:'',title:"Aanya's recital",m:'Personal · 6:30',status:'needs'},
  ];
  // Padhanam offers these from the day; the person chooses what to fold in, then writes their own words.
  const SEED=[
    {tone:'on_track',text:'You cleared the security approval, and Helios lifted out of risk.'},
    {tone:'behind',text:'The marathon long run slipped again this week.'},
    {tone:'needs',text:'The Helios SOW is still open ahead of Friday.'},
    {tone:'on_track',text:'Good 1:1 with Priya; pipeline is clearer.'},
  ];
  let entryText='', saved=false;
  const PAST=[
    {d:'Tue 3 Jun',s:'Northwind drifting; protected an hour for the pack.'},
    {d:'Mon 2 Jun',s:'Strong start. Cleared the Vertex redlines.'},
    {d:'Sun 1 Jun',s:'Rest. Family day, no work.'},
  ];

  const root=document.getElementById('root');
  function journalHTML(){
    return '<div class="journal"><div class="jhead"><span class="jt">Wednesday</span><span class="jd">4 June</span></div>'+
      '<div class="jblock-label">From your day</div><div class="seedlist" id="seedlist"></div>'+
      '<div class="jprompt">What went well, what slipped, and one thing for tomorrow.</div>'+
      '<textarea class="jwrite" id="jwrite" placeholder="In your own words&hellip;"></textarea>'+
      '<div class="jfoot"><button class="jsave" id="jsave">Save entry</button><span class="jsaved" id="jsaved">Saved</span></div></div>';
  }
  function wireJournal(){
    document.getElementById('seedlist').innerHTML=SEED.map((s,i)=>
      '<div class="seed" data-i="'+i+'"><span class="sdot" style="background:var(--'+s.tone+')"></span><span class="stx">'+s.text+'</span><button class="sadd">+ Add</button></div>').join('');
    const ta=document.getElementById('jwrite'); ta.value=entryText;
    ta.addEventListener('input',()=>{ entryText=ta.value; saved=false; document.getElementById('jsaved').classList.remove('show'); });
    document.querySelectorAll('.seed .sadd').forEach(b=>b.addEventListener('click',()=>{
      const seed=SEED[+b.closest('.seed').dataset.i]; const pre=ta.value && !ta.value.endsWith('\n')?ta.value+'\n':ta.value;
      ta.value=pre+seed.text+' '; entryText=ta.value; b.closest('.seed').classList.add('added'); ta.focus();
    }));
    document.getElementById('jsave').addEventListener('click',()=>{ saved=true; document.getElementById('jsaved').classList.add('show'); });
  }

  function renderToday(){
    root.innerHTML='<div class="today"><div class="todaymain"><h1>Good morning, Aanya</h1><div class="date">Wednesday, 4 June</div>'+
      '<div class="sec-h">Today, in priority order</div><div class="list">'+
      TODAY.map(it=>{ const c=TIER[it.cat]; return '<div class="row" data-tier="'+c.tier+'"><span class="cue" style="--tint:'+c.tint+'">'+c.icon+(it.init?'<span class="ci">'+it.init+'</span>':'')+'</span>'+
        '<div class="body"><div class="t">'+it.title+'</div><div class="m">'+it.m+'</div></div><span class="pill '+it.status+'">'+SL[it.status]+'</span></div>'; }).join('')+
      '</div></div><aside class="jrail">'+journalHTML()+'</aside></div>';
    wireJournal();
  }
  function renderJournal(){
    root.innerHTML='<div class="standalone"><div class="entries"><div class="eh">Recent entries</div>'+
      '<div class="eitem on"><div class="ed">Wed 4 Jun</div><div class="es">Today</div></div>'+
      PAST.map(p=>'<div class="eitem"><div class="ed">'+p.d+'</div><div class="es">'+p.s+'</div></div>').join('')+
      '</div><div class="standmain">'+journalHTML()+'</div></div>';
    wireJournal();
    document.querySelectorAll('.eitem').forEach(e=>e.addEventListener('click',()=>{ document.querySelectorAll('.eitem').forEach(x=>x.classList.remove('on')); e.classList.add('on'); }));
  }

  function updateThemeBtn(){ const tb=document.getElementById('themeToggle'); const dark=document.documentElement.getAttribute('data-theme')==='dark';
    tb.innerHTML=dark?I.sun:I.moon; tb.title=dark?'Switch to light mode':'Switch to dark mode'; }
  document.getElementById('themeToggle').addEventListener('click',()=>{ const d=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',d?'light':'dark'); updateThemeBtn(); });
  document.getElementById('viewSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('on',x===b));
    if(b.dataset.v==='today') renderToday(); else renderJournal(); });

  updateThemeBtn(); renderToday();
</script>
</body>
</html>
