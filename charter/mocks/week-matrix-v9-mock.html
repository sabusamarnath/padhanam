<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Week matrix v2 — design language preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-sans:'Plus Jakarta Sans',system-ui,sans-serif;
    --ink-1:#1c1c1a;--ink-2:#5f5e5a;--ink-3:#888780;
    --page:#eceef0;--surface-work:#ffffff;--surface-personal:#faf6ec;
    --hairline:rgba(26,26,25,0.12);--hairline-strong:rgba(26,26,25,0.18);
    --navy:#2e3264;--navy-hover:#262a55;--teal:#1a8070;
    --on_track:#3b6d11;--needs:#534ab7;--behind:#854f0b;--risk:#a32d2d;--done:#888780;
    --heat-risk:rgba(163,45,45,0.12);--heat-behind:rgba(133,79,11,0.12);
    --heat-needs:rgba(83,74,183,0.10);--heat-on_track:rgba(59,109,17,0.08);--heat-done:transparent;
    --wash-work-head:rgba(122,129,144,0.11);--wash-personal-head:rgba(176,153,126,0.15);
    --backdrop:rgba(0,0,0,0.2);--shadow-panel:0 8px 28px rgba(0,0,0,0.18);
    --radius-card:8px;--radius-input:4px;
  }
  [data-theme="dark"]{
    --ink-1:#f0eeea;--ink-2:#b4b2a9;--ink-3:#888780;
    --page:#161614;--surface-work:#232321;--surface-personal:#262320;
    --hairline:rgba(240,238,234,0.12);--hairline-strong:rgba(240,238,234,0.20);
    --navy:#3b4080;--navy-hover:#464c95;--teal:#2ba692;
    --on_track:#8ea868;--needs:#9f9ad0;--behind:#d3a05a;--risk:#d68e8e;--done:#8a8980;
    --heat-risk:rgba(214,142,142,0.16);--heat-behind:rgba(211,160,90,0.16);
    --heat-needs:rgba(159,154,208,0.14);--heat-on_track:rgba(142,168,104,0.12);--heat-done:transparent;
    --wash-work-head:rgba(138,144,157,0.16);--wash-personal-head:rgba(184,164,138,0.16);
    --backdrop:rgba(0,0,0,0.5);--shadow-panel:0 8px 28px rgba(0,0,0,0.5);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--ink-1);
    background:var(--page);-webkit-font-smoothing:antialiased;min-height:100vh;}
  .topbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
    background:var(--surface-work);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:10;}
  .topbar .brand{font-size:13px;font-weight:600;letter-spacing:0.02em;}
  .topbar .controls{display:flex;align-items:center;gap:14px;}
  .ctrl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-3);
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .ctrl button{font:inherit;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-2);background:none;
    border:1px solid var(--hairline-strong);border-radius:var(--radius-input);padding:3px 9px;cursor:pointer;}

  .wrap{max-width:780px;margin:0 auto;padding:22px 20px 90px;}
  .wk-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .wk-head h1{font-size:20px;font-weight:600;letter-spacing:-0.01em;}
  .wk-head .range{font-size:13px;color:var(--ink-2);}

  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .seg{display:inline-flex;border:1px solid var(--hairline-strong);border-radius:var(--radius-input);overflow:hidden;}
  .seg button{font:inherit;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;
    background:none;border:none;padding:5px 11px;color:var(--ink-2);cursor:pointer;}
  .seg button+button{border-left:1px solid var(--hairline-strong);}
  .seg button.on{background:var(--navy);color:#fff;}
  .fbtn{font:inherit;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;
    background:none;border:1px solid var(--hairline-strong);border-radius:var(--radius-input);
    padding:5px 11px;color:var(--ink-2);cursor:pointer;}
  .fbtn.on{background:color-mix(in srgb,var(--risk) 14%,transparent);color:var(--risk);border-color:var(--risk);}
  .fnote{font-size:11px;color:var(--ink-3);margin-left:auto;}

  .grid{display:grid;grid-template-columns:108px repeat(7,1fr);
    border:1px solid var(--hairline);border-radius:var(--radius-card);overflow:hidden;background:var(--surface-work);}
  .corner{border-bottom:1px solid var(--hairline);}
  .dayhead{padding:8px 4px;text-align:center;border-bottom:1px solid var(--hairline);border-left:1px solid var(--hairline);cursor:pointer;}
  .dayhead.sel{box-shadow:inset 0 -2px 0 var(--teal);}
  .dayhead.sel .dn,.dayhead.sel .dd{color:var(--teal);}
  .dayhead .dn{font-size:11px;font-weight:700;}
  .dayhead .dd{font-size:10px;color:var(--ink-3);margin-top:1px;}
  .dayhead[data-today] .dn,.dayhead[data-today] .dd{color:var(--teal);}
  .lanehead{display:flex;align-items:center;gap:7px;padding:0 10px;min-height:58px;
    border-bottom:1px solid var(--hairline);font-size:12px;font-weight:600;}
  .lanehead[data-tier="work"]{background:var(--wash-work-head);}
  .lanehead[data-tier="personal"]{background:var(--wash-personal-head);}
  .cell{min-height:58px;border-bottom:1px solid var(--hairline);border-left:1px solid var(--hairline);
    display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:6px 5px;cursor:pointer;
    transition:box-shadow 0.12s ease;}
  .cell.empty{cursor:default;}
  .faded{opacity:0.38;}
  .linkref .chip{outline:1.5px dashed var(--ink-3);outline-offset:2px;}
  .erow.depref{box-shadow:inset 3px 0 0 var(--ink-3);}
  .erow.depref .etitle{color:var(--ink-2);}
  .connectors path{pointer-events:stroke;cursor:pointer;}
  .grid.roomy .cell{align-content:flex-start;gap:6px;padding:8px 7px;min-height:64px;}
  .mini{display:flex;align-items:center;gap:6px;width:100%;}
  .mini .mlabel{font-size:11px;line-height:1.2;color:var(--ink-1);overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  .gridwrap{position:relative;}
  .connectors{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible;}
  .chip{position:relative;z-index:3;display:inline-flex;align-items:center;gap:2px;height:18px;padding:0 4px;border-radius:var(--radius-input);
    color:var(--st,var(--ink-2));background:color-mix(in srgb,var(--st,var(--ink-3)) 16%,transparent);}
  .chip.cat{color:var(--ink-2);background:transparent;padding:0;}
  .chip svg{width:13px;height:13px;display:block;}
  .chip .ci{font-size:9px;font-weight:700;line-height:1;}
  body.cue-off .chip svg{display:none;}
  .more{font-size:10px;font-weight:700;color:var(--ink-3);align-self:center;}

  .expand{margin-top:14px;border:1px solid var(--hairline);border-radius:var(--radius-card);
    background:var(--surface-work);overflow:hidden;display:none;}
  .expand.open{display:block;}
  .expand-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--hairline);
    font-size:12px;font-weight:600;}
  .expand-head .ehmeta{margin-left:auto;font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--ink-3);}
  .expand-head .ehclose{cursor:pointer;color:var(--ink-3);font-size:16px;line-height:1;padding:2px;}
  .erow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--hairline);cursor:pointer;}
  .erow:last-child{border-bottom:none;}
  .erow[data-tier="work"]:hover{background:rgba(122,129,144,0.06);}
  .erow[data-tier="personal"]:hover{background:rgba(176,153,126,0.08);}
  .erow .etitle{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .erow .emeta{font-size:12px;color:var(--ink-2);}
  .erow .edate{flex-shrink:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-3);}
  .pill{flex-shrink:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;
    padding:3px 9px;border-radius:9999px;white-space:nowrap;}
  .pill.on_track{background:color-mix(in srgb,var(--on_track) 16%,transparent);color:var(--on_track);}
  .pill.needs{background:color-mix(in srgb,var(--needs) 16%,transparent);color:var(--needs);}
  .pill.behind{background:color-mix(in srgb,var(--behind) 16%,transparent);color:var(--behind);}
  .pill.risk{background:color-mix(in srgb,var(--risk) 16%,transparent);color:var(--risk);}
  .pill.done{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done);}
  .pill.due{background:transparent;border:1.5px solid var(--ink-3);color:var(--ink-3);}

  .legend{display:flex;flex-wrap:wrap;gap:12px 16px;margin-top:14px;font-size:11px;color:var(--ink-2);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .sw{width:16px;height:12px;border-radius:3px;border:1px solid var(--hairline);}

  .backdrop{position:fixed;inset:0;background:var(--backdrop);opacity:0;pointer-events:none;transition:opacity 0.16s ease;z-index:40;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .panel{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:92vw;background:var(--surface-work);
    border-left:1px solid var(--hairline);box-shadow:var(--shadow-panel);transform:translateX(100%);
    transition:transform 0.22s cubic-bezier(0.16,1,0.3,1);z-index:50;display:flex;flex-direction:column;}
  .panel.open{transform:translateX(0);}
  .panel[data-tier="personal"]{background:var(--surface-personal);}
  .panel-top{height:48px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--hairline);}
  .panel-top .ptitle{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .panel-top .close{background:none;border:none;font-size:18px;color:var(--ink-3);cursor:pointer;padding:4px;}
  .panel-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;}
  .field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3);margin-bottom:4px;}
  .field-value{font-size:14px;}
  .link-note{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
  .desc{font-size:14px;color:var(--ink-2);line-height:1.55;}
  @media (prefers-reduced-motion:reduce){.panel,.backdrop,.cell{transition:none;}}
</style>
</head>
<body class="cue-on">
  <div class="topbar">
    <div class="brand">Week matrix</div>
    <div class="controls">
      <label class="ctrl"><input type="checkbox" id="cueToggle" checked /> Domain cue</label>
      <span class="ctrl"><button id="themeToggle">Dark mode</button></span>
    </div>
  </div>

  <div class="wrap">
    <div class="wk-head"><h1>This week</h1><span class="range">2 to 8 June</span></div>

    <div class="filters">
      <div class="seg" id="tierSeg">
        <button data-tier="all" class="on">All</button>
        <button data-tier="work">Work</button>
        <button data-tier="personal">Personal</button>
      </div>
      <button class="fbtn" id="attnBtn">Needs attention</button>
      <span class="fnote" id="fnote">Tap a cell to expand · tap a cue to highlight</span>
    </div>

    <div class="gridwrap"><div class="grid" id="grid"></div><svg class="connectors" id="conns" aria-hidden="true"></svg></div>
    <div class="expand" id="expand"></div>

    <div class="legend">
      <span><span class="sw" style="background:var(--risk);border:none"></span> at risk</span>
      <span><span class="sw" style="background:var(--behind);border:none"></span> behind</span>
      <span><span class="sw" style="background:var(--needs);border:none"></span> needs you</span>
      <span><span class="sw" style="background:var(--on_track);border:none"></span> on track</span>
      <span>cue colour = status · icon and letter = which context</span>
      <span><span class="sw" style="border:none;border-top:2px solid var(--ink-3);height:0;width:18px"></span> same item: do then due</span>
      <span><span class="sw" style="border:none;border-top:2px solid var(--risk);height:0;width:18px"></span> depends on / blocks</span>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="panel" id="panel" data-tier="work">
    <div class="panel-top"><span id="panelCue"></span><span class="ptitle" id="panelTitle"></span>
      <button class="close" id="panelClose" aria-label="Close">&times;</button></div>
    <div class="panel-body">
      <div><span class="pill" id="panelPill"></span></div>
      <div id="panelLinkWrap" style="display:none"><div class="field-label">Linked</div>
        <div class="link-note" id="panelLink"></div></div>
      <div><div class="field-label">Context</div><div class="field-value" id="panelContext"></div></div>
      <div><div class="field-label">Notes</div><div class="desc" id="panelDesc"></div></div>
    </div>
  </aside>

<script>
  const ICON_WORK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  const ICON_HOME='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>';
  const ICON_HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-9.5A3.5 3.5 0 0 1 12 7a3.5 3.5 0 0 1 7 3.5C19 15.5 12 20 12 20z"/></svg>';
  const ICON_FRIENDS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.6a3 3 0 0 1 0 5.4"/><path d="M17.5 14.6a5.5 5.5 0 0 1 3 5.4"/></svg>';
  const WARM='#b0997e',COOL='#7a8190';

  const LANES=[
    {key:'work',tier:'work',label:'Work',tint:COOL,icon:ICON_WORK},
    {key:'health',tier:'personal',label:'Health',tint:WARM,icon:ICON_HEART},
    {key:'family',tier:'personal',label:'Family',tint:WARM,icon:ICON_HOME},
    {key:'friends',tier:'personal',label:'Friends',tint:WARM,icon:ICON_FRIENDS},
  ];
  const DAYS=[
    {k:'mon',n:'Mon',d:'2'},{k:'tue',n:'Tue',d:'3'},{k:'wed',n:'Wed',d:'4',today:true},
    {k:'thu',n:'Thu',d:'5'},{k:'fri',n:'Fri',d:'6'},{k:'sat',n:'Sat',d:'7'},{k:'sun',n:'Sun',d:'8'},
  ];
  const DAYIX={}; DAYS.forEach((d,i)=>DAYIX[d.k]=i);
  const DAYLABEL={}; DAYS.forEach(d=>DAYLABEL[d.k]=d.n+' '+d.d);
  const STATUS_RANK={risk:5,behind:4,needs:3,on_track:2,done:1};
  const RANK_STATUS={5:'risk',4:'behind',3:'needs',2:'on_track',1:'done'};
  const STATUS_LABEL={risk:'At risk',behind:'Behind',needs:'Needs you',on_track:'On track',done:'Done',due:'Deadline'};

  const ITEMS=[
    {lane:'work',day:'mon',ctx:'Northwind',init:'N',status:'behind',title:'Monthly status pack',desc:'Two sections still open.'},
    {lane:'work',day:'mon',ctx:'Vertex',init:'V',status:'needs',title:'Contract review',desc:'Redlines back from legal.'},
    {lane:'work',day:'tue',ctx:'Helios',init:'H',status:'on_track',title:'SOW planning',desc:'Prep for the change request.'},
    {lane:'work',day:'tue',ctx:'Internal',status:'needs',title:'1:1 with Priya',desc:'Pull pipeline numbers first.'},
    {lane:'work',day:'wed',ctx:'Helios',init:'H',status:'needs',title:'SOW change request',desc:'Finish edits today so it clears review before Friday.',link:'Due Friday'},
    {lane:'work',day:'wed',ctx:'Internal',status:'risk',title:'Approve security policy',desc:'Overdue, and it blocks the Helios submission Friday.',link:'Blocks Helios submission'},
    {lane:'work',day:'wed',ctx:'Aurora',init:'A',status:'needs',title:'Kickoff agenda',desc:'Share before the call.'},
    {lane:'work',day:'wed',ctx:'Northwind',init:'N',status:'on_track',title:'Weekly check-in',desc:'Standing call.'},
    {lane:'work',day:'fri',ctx:'Helios',init:'H',status:'due',title:'SOW submission',desc:'Submission deadline, work sits Wednesday.',link:'Do by Wednesday'},
    {lane:'work',day:'fri',ctx:'Internal',status:'done',title:'Quarterly hiring plan',desc:'Approved and circulated.'},
    {lane:'work',day:'fri',ctx:'Vertex',init:'V',status:'needs',title:'Deliverable sign-off',desc:'Awaiting client confirmation.'},
    {lane:'health',day:'mon',ctx:'Health',status:'needs',title:'Dentist, 4:30pm',desc:'Leave by 4:00.'},
    {lane:'health',day:'tue',ctx:'Wide World Marathon',init:'BM',status:'on_track',title:'Tempo run',desc:'8 miles at race pace.'},
    {lane:'health',day:'sat',ctx:'Wide World Marathon',init:'BM',status:'on_track',title:'Rest day',desc:'Light stretch only.'},
    {lane:'family',day:'fri',ctx:'Family',status:'needs',title:"Aanya's recital",desc:'Doors at 6:30, leave by 6.'},
    {lane:'friends',day:'thu',ctx:'Friends',status:'needs',title:'Call Sam back',desc:'Left two messages last week.'},
  ];
  const LINKS=[
    {from:['work','wed','Helios'],   to:['work','fri','Helios'], type:'flow', rel:'do then due'},
    {from:['work','wed','Internal'], to:['work','fri','Helios'], type:'dep',  rel:'blocks'},
    {from:['work','mon','Vertex'],   to:['work','fri','Vertex'], type:'dep',  rel:'blocks'},
  ];

  const laneByKey={}; LANES.forEach(l=>laneByKey[l.key]=l);
  const iconFor=k=>laneByKey[k].icon;
  function laneChipHTML(k){ return '<span class="chip cat">'+iconFor(k)+'</span>'; }
  function cueHTML(k,init,status){
    const initSpan=init?'<span class="ci">'+init+'</span>':'';
    const st=(!status||status==='due')?'var(--ink-3)':'var(--'+status+')';
    return '<span class="chip" style="--st:'+st+'">'+iconFor(k)+initSpan+'</span>';
  }

  let tierFilter='all', attnOnly=false, selection=null; // selection {kind:'ctx'|'day'|'link'|'cell', key}
  const grid=document.getElementById('grid');
  const ATTN=new Set(['risk','behind','needs']);
  const tierOK=it=> tierFilter==='all' || laneByKey[it.lane].tier===tierFilter;
  const cellItems=(lk,dk)=>ITEMS.filter(it=>it.lane===lk && it.day===dk && tierOK(it));
  const attnFilter=items=> attnOnly ? items.filter(it=>ATTN.has(it.status)) : items;
  function worstStatus(items){ let w=null,r=0; items.forEach(it=>{const k=STATUS_RANK[it.status]||0; if(k>r){r=k;w=it.status;}}); return w; }
  const linkItems=end=>ITEMS.filter(it=>it.lane===end[0]&&it.day===end[1]&&it.ctx===end[2]&&tierOK(it));
  function cid(lane,day,ctx){ return 'chip-'+lane+'-'+day+'-'+ctx.replace(/\s+/g,'_'); }

  // ONE source of truth: the selected set of items drives the fade above AND the list below.
  function baseSet(){
    if(!selection) return null;
    let arr=[];
    if(selection.kind==='ctx') arr=ITEMS.filter(it=>it.ctx===selection.key && tierOK(it));
    else if(selection.kind==='day'){ const set=new Set(ITEMS.filter(it=>it.day===selection.key&&tierOK(it)).map(it=>it.ctx));
      arr=ITEMS.filter(it=>set.has(it.ctx)&&tierOK(it)); }
    else if(selection.kind==='link'){ const l=LINKS[selection.key]; arr=[...linkItems(l.from),...linkItems(l.to)]; }
    else if(selection.kind==='cell'){ arr=attnFilter(cellItems(selection.key[0],selection.key[1])); }
    return new Set(arr);
  }
  function expandNeighbors(base){
    const set=new Set(base); let changed=true;
    while(changed){ changed=false;
      LINKS.forEach(l=>{ const f=linkItems(l.from), t=linkItems(l.to);
        if(f.some(it=>set.has(it))) t.forEach(it=>{ if(!set.has(it)){set.add(it);changed=true;} });
        if(t.some(it=>set.has(it))) f.forEach(it=>{ if(!set.has(it)){set.add(it);changed=true;} });
      });
    }
    return set;
  }
  function activeSet(){ const b=baseSet(); return b?expandNeighbors(b):null; }

  function render(){
    const active=activeSet();
    const base=selection?baseSet():null;
    const isNbr=it=> base && active.has(it) && !base.has(it);
    const roomy=(tierFilter!=='all')||attnOnly||!!selection;
    grid.classList.toggle('roomy',roomy);
    const dayActive={};
    if(active) DAYS.forEach(d=>{ dayActive[d.k]=[...active].some(it=>it.day===d.k); });
    const dayFaded=dk=> active && !dayActive[dk] ? ' faded':'';
    const itemFaded=it=> active && !active.has(it) ? ' faded':'';
    const selDay = selection&&selection.kind==='day'?selection.key:null;

    let html='<div class="corner"></div>';
    DAYS.forEach(d=>{ html+='<div class="dayhead'+(d.today?' today':'')+(selDay===d.k?' sel':'')+dayFaded(d.k)+'" data-day="'+d.k+'"'+(d.today?' data-today':'')+'><div class="dn">'+d.n+'</div><div class="dd">'+d.d+'</div></div>'; });
    LANES.forEach(lane=>{
      if(tierFilter!=='all' && lane.tier!==tierFilter) return;
      html+='<div class="lanehead" data-tier="'+lane.tier+'">'+laneChipHTML(lane.key)+'<span>'+lane.label+'</span></div>';
      DAYS.forEach(day=>{
        const visible=attnFilter(cellItems(lane.key,day.k));
        if(visible.length===0){ html+='<div class="cell empty"></div>'; return; }
        let inner='';
        if(roomy){
          visible.forEach(it=>{
            inner+='<div class="mini'+itemFaded(it)+(isNbr(it)?' linkref':'')+'"><span data-ctx="'+it.ctx+'" id="'+cid(lane.key,day.k,it.ctx)+'">'+
              cueHTML(lane.key,it.init,it.status)+'</span><span class="mlabel">'+it.title+'</span></div>';
          });
        } else {
          const seen=[...new Set(visible.map(it=>it.ctx))]; const cap=4; let shown=0;
          seen.forEach(ctx=>{ if(shown>=cap) return;
            const its=visible.filter(it=>it.ctx===ctx); const w=worstStatus(its); const f=its.find(it=>it.init);
            inner+='<span class="cuewrap" data-ctx="'+ctx+'" id="'+cid(lane.key,day.k,ctx)+'">'+cueHTML(lane.key,f?f.init:undefined,w)+'</span>'; shown++;
          });
          if(seen.length>cap) inner+='<span class="more">+'+(seen.length-cap)+'</span>';
        }
        html+='<div class="cell'+dayFaded(day.k)+'" data-lane="'+lane.key+'" data-day="'+day.k+'">'+inner+'</div>';
      });
    });
    grid.innerHTML=html;
    grid.querySelectorAll('.dayhead[data-day]').forEach(dh=>dh.addEventListener('click',()=>toggle('day',dh.dataset.day)));
    grid.querySelectorAll('.cell:not(.empty)').forEach(cell=>{
      cell.addEventListener('click',e=>{
        const cw=e.target.closest('[data-ctx]');
        if(cw){ e.stopPropagation(); toggle('ctx',cw.dataset.ctx); return; }
        toggle('cell',[cell.dataset.lane,cell.dataset.day]);
      });
    });
    drawConnectors(active);
    updateExpand(active);
  }

  const conns=document.getElementById('conns'), SVGNS='http://www.w3.org/2000/svg';
  function linkRank(l){ const its=[...linkItems(l.from),...linkItems(l.to)]; return Math.max(0,...its.map(it=>STATUS_RANK[it.status]||0)); }
  function drawConnectors(active){
    const wrap=conns.parentElement, cr=wrap.getBoundingClientRect();
    conns.setAttribute('width',cr.width); conns.setAttribute('height',cr.height); conns.setAttribute('viewBox','0 0 '+cr.width+' '+cr.height);
    while(conns.firstChild) conns.removeChild(conns.firstChild);
    const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink-3').trim()||'#888';
    conns.insertAdjacentHTML('afterbegin','<defs><marker id="dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>');
    const maxRank=Math.max(0,...LINKS.map(linkRank));
    LINKS.forEach((l,i)=>{
      const a=document.getElementById(cid(...l.from)), b=document.getElementById(cid(...l.to)); if(!a||!b) return;
      const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
      const x1=ar.left+ar.width/2-cr.left, y1=ar.top+ar.height/2-cr.top, x2=br.left+br.width/2-cr.left, y2=br.top+br.height/2-cr.top;
      const bow=Math.min(24,Math.max(14,Math.abs(x2-x1)*0.18)), top=Math.min(y1,y2)-bow, rank=linkRank(l);
      const stColor=l.type==='dep'?getComputedStyle(document.documentElement).getPropertyValue('--'+(RANK_STATUS[rank]||'risk')).trim():ink;
      let emph; if(active){ emph=linkItems(l.from).some(it=>active.has(it))||linkItems(l.to).some(it=>active.has(it)); } else emph=(rank===maxRank);
      const p=document.createElementNS(SVGNS,'path');
      p.setAttribute('d','M '+x1+' '+y1+' C '+x1+' '+top+' '+x2+' '+top+' '+x2+' '+y2);
      p.setAttribute('fill','none'); p.setAttribute('stroke',stColor); p.setAttribute('stroke-width',emph?'2.2':'1.5');
      p.setAttribute('stroke-linecap','round'); p.setAttribute('opacity', emph?0.95:(l.type==='dep'?0.55:0.35));
      if(l.type==='flow') p.setAttribute('stroke-dasharray','2 4');
      if(l.type==='dep') p.setAttribute('marker-end','url(#dep)');
      p.addEventListener('click',ev=>{ ev.stopPropagation(); toggle('link',i); });
      conns.appendChild(p);
    });
  }

  const expand=document.getElementById('expand');
  function rowsHTML(rows){
    let h='';
    rows.forEach((r,i)=>{ const it=r.item, lane=laneByKey[r.lk];
      h+='<div class="erow'+(r.dep?' depref':'')+'" data-tier="'+lane.tier+'" data-ri="'+i+'">'+cueHTML(r.lk,it.init,it.status)+
        '<div style="flex:1;min-width:0"><div class="etitle">'+it.ctx+': '+it.title+'</div>'+
        (it.link?'<div class="emeta">'+it.link+'</div>':'')+'</div>'+
        '<span class="edate">'+DAYLABEL[it.day]+'</span>'+
        '<span class="pill '+it.status+'">'+STATUS_LABEL[it.status]+'</span></div>';
    });
    return h;
  }
  function updateExpand(active){
    if(!selection || !active){ expand.classList.remove('open'); return; }
    const base=baseSet();
    const sortDay=(a,b)=>DAYIX[a.day]-DAYIX[b.day];
    const baseArr=[...active].filter(it=>base.has(it)).sort(sortDay);
    const nbrArr=[...active].filter(it=>!base.has(it)).sort(sortDay);
    const rows=baseArr.map(it=>({item:it,lk:it.lane,dep:false})).concat(nbrArr.map(it=>({item:it,lk:it.lane,dep:true})));
    const set=[...active];
    let head;
    if(selection.kind==='ctx') head='<span>'+selection.key+' · across the week</span>';
    else if(selection.kind==='day'){ const d=DAYS.find(x=>x.k===selection.key); head="<span>"+d.n+' '+d.d+" · this day and where it recurs</span>"; }
    else if(selection.kind==='link') head='<span>Linked · '+LINKS[selection.key].rel+'</span>';
    else { const d=DAYS.find(x=>x.k===selection.key[1]); head=laneChipHTML(selection.key[0])+'<span>'+laneByKey[selection.key[0]].label+' · '+d.n+' '+d.d+'</span>'; }
    const meta=set.length+' item'+(set.length!==1?'s':'');
    expand.innerHTML='<div class="expand-head">'+head+'<span class="ehmeta">'+meta+'</span><span class="ehclose" id="ehclose">&times;</span></div>'+rowsHTML(rows);
    expand.classList.add('open');
    document.getElementById('ehclose').addEventListener('click',()=>{ selection=null; setNote(); render(); });
    expand.querySelectorAll('.erow').forEach(row=>row.addEventListener('click',()=>{ const r=rows[+row.dataset.ri]; openPanel(r.item, laneByKey[r.lk]); }));
  }

  const panel=document.getElementById('panel'),backdrop=document.getElementById('backdrop');
  function openPanel(it,lane){
    panel.dataset.tier=lane.tier;
    document.getElementById('panelCue').innerHTML=cueHTML(lane.key,it.init,it.status);
    document.getElementById('panelTitle').textContent=it.ctx+' · '+it.title;
    const pill=document.getElementById('panelPill'); pill.className='pill '+it.status; pill.textContent=STATUS_LABEL[it.status];
    const lw=document.getElementById('panelLinkWrap');
    if(it.link){ lw.style.display='block'; document.getElementById('panelLink').textContent=it.link; } else lw.style.display='none';
    document.getElementById('panelContext').textContent=it.ctx;
    document.getElementById('panelDesc').textContent=it.desc;
    panel.classList.add('open'); backdrop.classList.add('open');
  }
  function closePanel(){ panel.classList.remove('open'); backdrop.classList.remove('open'); }
  backdrop.addEventListener('click',closePanel);
  document.getElementById('panelClose').addEventListener('click',closePanel);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePanel(); }});

  const fnote=document.getElementById('fnote');
  function setNote(){
    if(!selection){ fnote.textContent='Tap a cue, a day, or an arrow. The week above and the list below always match.'; return; }
    const m={ctx:'item',day:'day',link:'link',cell:'cell'};
    fnote.textContent='Showing one '+m[selection.kind]+' · tap it again to clear';
  }
  function toggle(kind,key){
    const same = selection && selection.kind===kind && JSON.stringify(selection.key)===JSON.stringify(key);
    selection = same ? null : {kind,key};
    setNote(); render();
  }

  document.getElementById('tierSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    tierFilter=b.dataset.tier; selection=null; setNote();
    document.querySelectorAll('#tierSeg button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
  document.getElementById('attnBtn').addEventListener('click',e=>{ attnOnly=!attnOnly; e.target.classList.toggle('on',attnOnly); selection=null; setNote(); render(); });
  document.getElementById('cueToggle').addEventListener('change',e=>document.body.classList.toggle('cue-off',!e.target.checked));
  const tb=document.getElementById('themeToggle');
  tb.addEventListener('click',()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',dark?'light':'dark'); tb.textContent=dark?'Dark mode':'Light mode'; render();});
  window.addEventListener('resize',()=>drawConnectors(activeSet()));

  setNote(); render();

</script>
</body>
</html>
