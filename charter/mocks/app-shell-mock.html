<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Padhanam — shell, landing and settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-sans:'Plus Jakarta Sans',system-ui,sans-serif;
    --ink-1:#1c1c1a;--ink-2:#5f5e5a;--ink-3:#888780;
    --page:#eceef0;--surface:#ffffff;--surface-2:#f5f5f3;--rail:#fafaf8;
    --surface-personal:#faf6ec;
    --hairline:rgba(26,26,25,0.12);--hairline-strong:rgba(26,26,25,0.20);
    --navy:#2e3264;--navy-hover:#262a55;--teal:#1a8070;
    --on_track:#3b6d11;--needs:#534ab7;--behind:#854f0b;--risk:#a32d2d;--done:#888780;
    --cool:#7a8190;--warm:#b0997e;
    --radius:10px;--radius-input:6px;
  }
  [data-theme="dark"]{
    --ink-1:#f0eeea;--ink-2:#b4b2a9;--ink-3:#888780;
    --page:#161614;--surface:#222220;--surface-2:#1c1c1a;--rail:#1a1a18;--surface-personal:#262320;
    --hairline:rgba(240,238,234,0.12);--hairline-strong:rgba(240,238,234,0.22);
    --navy:#3b4080;--navy-hover:#464c95;--teal:#2ba692;
    --on_track:#8ea868;--needs:#9f9ad0;--behind:#d3a05a;--risk:#d68e8e;--done:#8a8980;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-sans);font-size:14px;color:var(--ink-1);background:var(--page);-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
  @media (max-width:760px){ .app{grid-template-columns:1fr;} .rail{display:none;} }

  /* RAIL */
  .rail{background:var(--rail);border-right:1px solid var(--hairline);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;}
  .brand svg{width:24px;height:24px;color:var(--navy);} .brand .nm{font-size:15px;font-weight:600;}
  .navgroup{margin-top:10px;}
  .navlabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3);padding:6px 10px;}
  .navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-input);cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:500;}
  .navitem:hover{background:var(--surface-2);color:var(--ink-1);}
  .navitem.on{background:color-mix(in srgb,var(--navy) 12%,transparent);color:var(--ink-1);font-weight:600;}
  .navitem svg{width:17px;height:17px;flex-shrink:0;}
  .navitem .wsdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-left:3px;}
  .railspace{flex:1;}
  .acct{display:flex;align-items:center;gap:9px;padding:8px 10px;border-top:1px solid var(--hairline);margin-top:8px;cursor:pointer;border-radius:var(--radius-input);}
  .acct:hover{background:var(--surface-2);}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0;}
  .acct .who{flex:1;min-width:0;} .acct .who .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .acct .who .e{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* MAIN */
  .main{padding:26px 30px 60px;max-width:860px;}
  .topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .tbtn{font:inherit;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-2);background:none;border:1px solid var(--hairline-strong);border-radius:var(--radius-input);padding:4px 10px;cursor:pointer;}
  .tbtn.ico{padding:6px;display:grid;place-items:center;color:var(--ink-2);}
  .tbtn.ico:hover{color:var(--ink-1);background:var(--surface-2);}
  .tbtn.ico svg{width:17px;height:17px;}
  h1{font-size:22px;font-weight:600;letter-spacing:-0.01em;}
  .date{font-size:13px;color:var(--ink-2);margin-top:2px;}

  /* PULSE */
  .pulse{background:var(--surface);border:1px solid var(--hairline);border-left:3px solid var(--behind);border-radius:var(--radius);padding:15px 17px;margin:18px 0 22px;}
  .pulse .pl{font-size:14.5px;font-weight:600;line-height:1.45;}
  .pulse .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:9999px;background:var(--surface-2);color:var(--ink-2);}
  .chip.risk{background:color-mix(in srgb,var(--risk) 15%,transparent);color:var(--risk);}
  .pulse a{display:inline-block;margin-top:11px;font-size:12px;font-weight:600;color:var(--teal);text-decoration:none;}

  .sec-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-3);margin:6px 0 11px;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:var(--radius-input);border:1px solid var(--hairline);background:var(--surface);}
  .row[data-tier="personal"]{background:var(--surface-personal);}
  .cue{flex-shrink:0;display:inline-flex;align-items:center;gap:2px;color:var(--tint);} .cue svg{width:16px;height:16px;} .cue .ci{font-size:9px;font-weight:700;}
  .row .body{flex:1;min-width:0;} .row .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .m{font-size:12px;color:var(--ink-2);margin-top:2px;display:flex;gap:7px;align-items:center;}
  .wstag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-3);border:1px solid var(--hairline-strong);border-radius:3px;padding:0 5px;}
  .pill{flex-shrink:0;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;padding:3px 9px;border-radius:9999px;}
  .pill.on_track{background:color-mix(in srgb,var(--on_track) 16%,transparent);color:var(--on_track);}
  .pill.needs{background:color-mix(in srgb,var(--needs) 16%,transparent);color:var(--needs);}
  .pill.behind{background:color-mix(in srgb,var(--behind) 16%,transparent);color:var(--behind);}
  .pill.risk{background:color-mix(in srgb,var(--risk) 16%,transparent);color:var(--risk);}

  /* SETTINGS */
  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .card-h{font-size:14px;font-weight:600;margin-bottom:4px;}
  .card-sub{font-size:12.5px;color:var(--ink-2);margin-bottom:16px;line-height:1.5;}
  .acctline{display:flex;align-items:center;gap:13px;}
  .acctline .avatar{width:44px;height:44px;font-size:16px;}
  .acctline .who .n{font-size:15px;font-weight:600;} .acctline .who .e{font-size:13px;color:var(--ink-2);}
  .acctline .grow{flex:1;}
  .conn{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--hairline);}
  .conn:first-of-type{border-top:none;}
  .conn .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);flex-shrink:0;}
  .conn .ico svg{width:18px;height:18px;color:var(--ink-1);}
  .conn .ci{flex:1;min-width:0;} .conn .ci .cn{font-size:13.5px;font-weight:600;} .conn .ci .cd{font-size:12px;color:var(--ink-2);margin-top:2px;}
  .conn .cstat{font-size:11px;font-weight:600;color:var(--on_track);margin-right:4px;display:none;}
  .conn.connected .cstat{display:inline;}
  .btn-conn{font:inherit;font-size:12.5px;font-weight:600;border-radius:var(--radius-input);padding:7px 14px;cursor:pointer;border:1px solid var(--hairline-strong);background:var(--surface);color:var(--ink-1);}
  .conn.connected .btn-conn{color:var(--ink-2);}
  .btn-conn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn-conn.primary:hover{background:var(--navy-hover);}
  .row-opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--hairline);}
  .row-opt:first-of-type{border-top:none;}
  .row-opt .lab{font-size:13.5px;font-weight:500;} .row-opt .lab small{display:block;font-size:12px;color:var(--ink-2);font-weight:400;margin-top:2px;}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-input);padding:3px;gap:3px;}
  .seg button{font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);background:none;border:none;border-radius:4px;padding:5px 12px;cursor:pointer;}
  .seg button.on{background:var(--surface);color:var(--ink-1);}
  .danger{color:var(--risk);border-color:color-mix(in srgb,var(--risk) 40%,transparent);}
  .seemore{font:inherit;font-size:12.5px;font-weight:600;color:var(--teal);background:none;border:none;cursor:pointer;padding:11px 0 0;}
  .conn-note{font-size:12px;color:var(--ink-3);margin:2px 0 12px;display:flex;align-items:center;gap:7px;}
  .conn-note .gdot{width:14px;height:14px;border-radius:50%;background:conic-gradient(#ea4335,#fbbc05,#34a853,#4285f4,#ea4335);flex-shrink:0;}
  .placeholder{background:var(--surface);border:1px dashed var(--hairline-strong);border-radius:var(--radius);padding:30px;text-align:center;color:var(--ink-2);font-size:13.5px;}
</style>
</head>
<body>
  <div class="app">
    <nav class="rail">
      <div class="brand"><svg viewBox="0 0 32 32" fill="none"><circle cx="11" cy="16" r="3.2" fill="currentColor"/><circle cx="21" cy="11" r="3.2" fill="currentColor"/><circle cx="21" cy="21" r="3.2" fill="currentColor"/><path d="M13.5 14.5 19 12 M13.5 17.5 19 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="nm">Padhanam</span></div>
      <div class="navgroup">
        <div class="navitem on" data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><circle cx="4" cy="7" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="17" r="1"/></svg>Today</div>
        <div class="navitem" data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/><line x1="15" y1="9" x2="15" y2="21"/></svg>Week</div>
        <div class="navitem" data-view="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14a4 4 0 1 0-4-4"/><path d="M12 14v0"/><path d="M5 19a9 9 0 1 1 14 0"/></svg>How am I doing</div>
      </div>
      <div class="navgroup">
        <div class="navlabel">Workspaces</div>
        <div class="navitem" data-view="ws"><span class="wsdot" style="background:var(--risk)"></span>Helios</div>
        <div class="navitem" data-view="ws"><span class="wsdot" style="background:var(--behind)"></span>Northwind</div>
        <div class="navitem" data-view="ws"><span class="wsdot" style="background:var(--needs)"></span>Vertex</div>
        <div class="navitem" data-view="ws"><span class="wsdot" style="background:var(--needs)"></span>Aurora</div>
        <div class="navitem" data-view="ws"><span class="wsdot" style="background:var(--warm)"></span>Personal</div>
      </div>
      <div class="railspace"></div>
      <div class="navgroup">
        <div class="navitem" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5L3.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h5l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>Settings</div>
      </div>
      <div class="acct" data-view="settings"><div class="avatar">AK</div><div class="who"><div class="n">Aanya Krishnan</div><div class="e">aanya@company.com</div></div></div>
    </nav>

    <main class="main" id="main"></main>
  </div>

<script>
  const I={
    work:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-9.5A3.5 3.5 0 0 1 12 7a3.5 3.5 0 0 1 7 3.5C19 15.5 12 20 12 20z"/></svg>',
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>',
    friends:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.6a3 3 0 0 1 0 5.4"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>',
    slack:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="3" x2="9" y2="15"/><line x1="15" y1="9" x2="15" y2="21"/><line x1="3" y1="15" x2="15" y2="15"/><line x1="9" y1="9" x2="21" y2="9"/></svg>',
    drive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l5 9-4 7H7l-4-7z"/><path d="M3 12h18"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8 8 0 1 1 11.2 3a6 6 0 0 0 9.8 9.8z"/></svg>',
  };
  const TIER={work:{tint:'var(--cool)',tier:'work',icon:I.work},health:{tint:'var(--warm)',tier:'personal',icon:I.heart},family:{tint:'var(--warm)',tier:'personal',icon:I.home},friends:{tint:'var(--warm)',tier:'personal',icon:I.friends}};
  const SL={on_track:'On track',needs:'Needs you',behind:'Behind',risk:'At risk'};
  const TODAY=[
    {cat:'work',init:'',title:'Approve security policy',ws:'Internal',when:'Overdue · blocks Helios Friday',status:'risk'},
    {cat:'work',init:'H',title:'SOW change request',ws:'Helios',when:'Submit Friday',status:'needs'},
    {cat:'work',init:'',title:'1:1 with Priya',ws:'Internal',when:'2:00pm',status:'needs'},
    {cat:'health',init:'',title:'Dentist, 4:30pm',ws:'Personal',when:'Leave by 4',status:'needs'},
    {cat:'work',init:'N',title:'Northwind monthly status pack',ws:'Northwind',when:'Slipping',status:'behind'},
    {cat:'family',init:'',title:"Aanya's recital",ws:'Personal',when:'Leave by 6',status:'needs'},
    {cat:'friends',init:'',title:'Call Sam back',ws:'Personal',when:'Owed a reply',status:'needs'},
  ];
  // Connections are shaped by how you signed in. Google login surfaces Google apps first.
  const PRIMARY=[
    {id:'gcal',name:'Google Calendar',ico:I.cal,desc:'Events flow onto your day and into workspace timelines.',connected:true},
    {id:'gmail',name:'Gmail',ico:I.mail,desc:'Flagged threads come in as items you can act on.',connected:false},
    {id:'gdrive',name:'Google Drive',ico:I.drive,desc:'Link documents to the cases they belong to.',connected:false},
    {id:'gmeet',name:'Google Meet',ico:I.cal,desc:'Meeting notes and follow-ups become items.',connected:false},
  ];
  const MORE=[
    {id:'ms',name:'Outlook & Microsoft 365',ico:I.mail,desc:'Calendar and mail for Microsoft accounts.',connected:false},
    {id:'slack',name:'Slack',ico:I.slack,desc:'Mentions and threads that need you surface as items.',connected:false},
    {id:'notion',name:'Notion',ico:I.drive,desc:'Bring pages and tasks in as linked items.',connected:false},
    {id:'zoom',name:'Zoom',ico:I.cal,desc:'Recordings and action items from your calls.',connected:false},
  ];
  let moreOpen=false;

  const main=document.getElementById('main');
  function topline(extra){ return '<div class="topline"><div>'+extra+'</div><button class="tbtn ico" id="themeToggle"></button></div>'; }
  function updateThemeBtn(){ const tb=document.getElementById('themeToggle'); if(!tb) return; const dark=document.documentElement.getAttribute('data-theme')==='dark';
    tb.innerHTML=dark?I.sun:I.moon; tb.title=dark?'Switch to light mode':'Switch to dark mode'; tb.setAttribute('aria-label',tb.title); }

  function renderToday(){
    main.innerHTML=topline('<h1>Good morning, Aanya</h1><div class="date">Wednesday, 4 June</div>')+
      '<div class="pulse"><div class="pl">Mostly on track, with two pressure points. The security approval is overdue and it is blocking Helios on Friday, which makes it your highest-leverage move today.</div>'+
      '<div class="chips"><span class="chip risk">1 at risk</span><span class="chip">1 behind</span><span class="chip">84% work this week</span><span class="chip">Helios at risk</span></div>'+
      '<a href="#" data-go="dash">See how am I doing &rarr;</a></div>'+
      '<div class="sec-h">Today, in priority order</div><div class="list">'+
      TODAY.map(it=>{ const c=TIER[it.cat]; return '<div class="row" data-tier="'+c.tier+'">'+
        '<span class="cue" style="--tint:'+c.tint+'">'+c.icon+(it.init?'<span class="ci">'+it.init+'</span>':'')+'</span>'+
        '<div class="body"><div class="t">'+it.title+'</div><div class="m"><span class="wstag">'+it.ws+'</span>'+it.when+'</div></div>'+
        '<span class="pill '+it.status+'">'+SL[it.status]+'</span></div>'; }).join('')+'</div>';
    wireCommon(); const g=main.querySelector('[data-go]'); if(g) g.addEventListener('click',e=>{e.preventDefault();go('dash');});
  }

  function renderSettings(){
    main.innerHTML=topline('<h1>Settings</h1><div class="date">Account, connections and data</div>')+
      '<div class="card"><div class="card-h">Account</div><div class="acctline"><div class="avatar">AK</div><div class="who"><div class="n">Aanya Krishnan</div><div class="e">aanya@company.com</div></div><div class="grow"></div><button class="btn-conn">Sign out</button></div></div>'+
      '<div class="card"><div class="card-h">Connected accounts</div>'+
      '<div class="conn-note"><span class="gdot"></span>You signed in with Google, so your Google apps connect in one step.</div>'+
      '<div id="connPrimary"></div>'+
      '<button class="seemore" id="seeMore">See more integrations &rarr;</button>'+
      '<div id="connMore" style="display:none;margin-top:4px;border-top:1px solid var(--hairline);padding-top:4px;"></div></div>'+
      '<div class="card"><div class="card-h">Privacy and data</div><div class="card-sub">Your work and personal life sit in one private graph. You own it, and you can take it or erase it in a single action.</div>'+
        '<div class="row-opt"><div class="lab">Export everything<small>All items, workspaces and the causal graph, as a portable file.</small></div><button class="btn-conn">Export</button></div>'+
        '<div class="row-opt"><div class="lab">Delete all my data<small>A clean wipe across every store. This cannot be undone.</small></div><button class="btn-conn danger">Delete</button></div></div>'+
      '<div class="card"><div class="card-h">Appearance</div><div class="row-opt"><div class="lab">Theme</div><div class="seg" id="themeSeg"><button data-t="light">Light</button><button data-t="dark">Dark</button><button data-t="system">System</button></div></div></div>';
    renderConns(); wireCommon();
    const sm=document.getElementById('seeMore');
    sm.addEventListener('click',()=>{ moreOpen=!moreOpen; document.getElementById('connMore').style.display=moreOpen?'block':'none'; sm.innerHTML=moreOpen?'Show fewer &larr;':'See more integrations &rarr;'; });
    const cur=document.documentElement.getAttribute('data-theme');
    main.querySelectorAll('#themeSeg button').forEach(b=>{ b.classList.toggle('on',b.dataset.t===cur);
      b.addEventListener('click',()=>{ if(b.dataset.t!=='system') setTheme(b.dataset.t); main.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('on',x===b)); }); });
  }
  function connHTML(c){ return '<div class="conn '+(c.connected?'connected':'')+'" data-id="'+c.id+'"><div class="ico">'+c.ico+'</div>'+
      '<div class="ci"><div class="cn">'+c.name+'</div><div class="cd">'+c.desc+'</div></div>'+
      '<span class="cstat">Connected</span><button class="btn-conn '+(c.connected?'':'primary')+'">'+(c.connected?'Disconnect':'Connect')+'</button></div>'; }
  function renderConns(){
    document.getElementById('connPrimary').innerHTML=PRIMARY.map(connHTML).join('');
    document.getElementById('connMore').innerHTML=MORE.map(connHTML).join('');
    document.getElementById('connMore').style.display=moreOpen?'block':'none';
    document.querySelectorAll('.conn .btn-conn').forEach(b=>b.addEventListener('click',()=>{ const id=b.closest('.conn').dataset.id; const c=PRIMARY.concat(MORE).find(x=>x.id===id); c.connected=!c.connected; renderConns(); }));
  }

  function renderPlaceholder(name){ main.innerHTML=topline('<h1>'+name+'</h1>')+'<div class="placeholder">'+name+' has its own surface in the preview set. In the live shell it renders here.</div>'; wireCommon(); }

  function wireCommon(){ const tb=document.getElementById('themeToggle'); if(tb){ updateThemeBtn();
    tb.addEventListener('click',()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')); } }
  function setTheme(t){ document.documentElement.setAttribute('data-theme',t); updateThemeBtn();
    const seg=document.getElementById('themeSeg'); if(seg) seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.t===t)); }

  function go(view,el){
    document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('on'));
    if(el) el.classList.add('on'); else { const n=document.querySelector('.navitem[data-view="'+view+'"]'); if(n) n.classList.add('on'); }
    if(view==='today') renderToday();
    else if(view==='settings') renderSettings();
    else if(view==='week') renderPlaceholder('Week');
    else if(view==='dash') renderPlaceholder('How am I doing');
    else if(view==='ws') renderPlaceholder('Workspace');
  }
  document.querySelectorAll('.navitem, .acct').forEach(n=>n.addEventListener('click',()=>go(n.dataset.view,n.classList.contains('navitem')?n:null)));
  renderToday();
</script>
</body>
</html>
