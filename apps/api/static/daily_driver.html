<!DOCTYPE html>
<!--
  Daily-driver operator surface (D157, S58) — the first instance of the
  Phase 2 whole-life causal daily driver. Self-contained: vanilla JS, no
  build step, no external deps. Styling uses the Padhanam brand tokens
  (charter/brand/tokens.css, inlined here because charter/ is not in the
  API image; production serves the canonical tokens.css). Served at /app
  (auth-exempt); the page prompts for a dev bearer token and attaches it
  to the authenticated fetches it makes to /api/v1/daily-driver/*.
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Padhanam — Today</title>
  <style>
    :root {
      --bg-primary: #1c1c1a; --bg-secondary: #252523; --bg-tertiary: #2c2c2a;
      --bg-danger: #501313; --bg-warning: #412402; --bg-success: #173404;
      --text-primary: #f0eeea; --text-secondary: #b4b2a9; --text-tertiary: #888780;
      --text-danger: #f09595; --text-warning: #ef9f27; --text-success: #97c459;
      --border-tertiary: rgba(240,238,234,0.12); --border-secondary: rgba(240,238,234,0.25);
      --brand-teal: #2BA692; --brand-teal-accessible: #1A8070; --accent: #2E3264;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px;
      --radius-md: 8px; --radius-lg: 12px; --radius-full: 9999px;
      --shadow-md: 0 4px 12px rgba(0,0,0,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans); font-size: 14px; line-height: 1.6;
      color: var(--text-primary); background: var(--bg-primary);
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-2xl) var(--space-lg) 80px; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-sm); }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    h1 .teal { color: var(--brand-teal); }
    .day { color: var(--text-tertiary); font-size: 13px; }
    .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: var(--space-xl); }
    .token-bar {
      display: flex; gap: var(--space-sm); margin-bottom: var(--space-xl);
      background: var(--bg-secondary); border: 1px solid var(--border-tertiary);
      border-radius: var(--radius-md); padding: var(--space-sm);
    }
    input, select {
      font-family: var(--font-sans); font-size: 13px; color: var(--text-primary);
      background: var(--bg-tertiary); border: 1px solid var(--border-tertiary);
      border-radius: var(--radius-md); padding: 8px 10px;
    }
    input:focus, select:focus { outline: none; border-color: var(--brand-teal); }
    .token-bar input { flex: 1; }
    button {
      font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer;
      color: var(--text-primary); background: var(--bg-tertiary);
      border: 1px solid var(--border-secondary); border-radius: var(--radius-md);
      padding: 7px 12px; transition: background 0.12s, border-color 0.12s;
    }
    button:hover { background: var(--accent); border-color: var(--brand-teal-accessible); }
    button.primary { background: var(--brand-teal-accessible); border-color: var(--brand-teal); color: #fff; }
    button.primary:hover { background: var(--brand-teal); }
    button.ghost { background: transparent; border-color: var(--border-tertiary); color: var(--text-secondary); padding: 6px 9px; }
    button:disabled { opacity: 0.4; cursor: default; }
    ul { list-style: none; }
    .item {
      display: flex; align-items: center; gap: var(--space-md);
      background: var(--bg-secondary); border: 1px solid var(--border-tertiary);
      border-left: 3px solid var(--border-tertiary);
      border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg); margin-bottom: 10px;
    }
    .item.behind { border-left-color: var(--text-danger); }
    .item.needs_you { border-left-color: var(--text-warning); }
    .item.on_track { border-left-color: var(--text-success); }
    .item.done { opacity: 0.5; border-left-color: var(--text-tertiary); }
    .item .body { flex: 1; min-width: 0; }
    .item .title { font-weight: 500; }
    .item.done .title { text-decoration: line-through; }
    .item .detail { font-size: 12px; color: var(--text-secondary); }
    .pill {
      font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
      padding: 3px 9px; border-radius: var(--radius-full); white-space: nowrap;
    }
    .pill.behind { background: var(--bg-danger); color: var(--text-danger); }
    .pill.needs_you { background: var(--bg-warning); color: var(--text-warning); }
    .pill.on_track { background: var(--bg-success); color: var(--text-success); }
    .pill.done { background: var(--bg-tertiary); color: var(--text-tertiary); }
    .reorder { display: flex; flex-direction: column; gap: 2px; }
    .reorder button { padding: 2px 7px; font-size: 11px; line-height: 1.2; }
    .actions { display: flex; gap: 6px; }
    .kind-tag { font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
    .new-form {
      display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center;
      background: var(--bg-secondary); border: 1px solid var(--border-tertiary);
      border-radius: var(--radius-md); padding: var(--space-md); margin-top: var(--space-xl);
    }
    .new-form input.name { flex: 1; min-width: 160px; }
    .new-form input.days { width: 70px; }
    .section-label { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin: var(--space-xl) 0 var(--space-sm); }
    .empty { color: var(--text-tertiary); font-style: italic; padding: var(--space-lg); text-align: center; }
    .panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 92vw);
      background: var(--bg-secondary); border-left: 1px solid var(--border-secondary);
      box-shadow: var(--shadow-md); padding: var(--space-2xl); overflow-y: auto;
      transform: translateX(100%); transition: transform 0.18s ease;
    }
    .panel.open { transform: translateX(0); }
    .panel h2 { font-size: 18px; margin-bottom: 4px; }
    .panel .cell { font-size: 12px; color: var(--brand-teal); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: var(--space-lg); }
    .panel .close { position: absolute; top: var(--space-lg); right: var(--space-lg); }
    .dp { background: var(--bg-tertiary); border-radius: var(--radius-md); padding: var(--space-md); margin-bottom: var(--space-sm); }
    .dp .dt { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; }
    .toast {
      position: fixed; bottom: var(--space-xl); left: 50%; transform: translateX(-50%);
      background: var(--bg-tertiary); border: 1px solid var(--border-secondary);
      border-radius: var(--radius-md); padding: 10px 16px; font-size: 13px;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { border-color: var(--text-danger); color: var(--text-danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Padhanam <span class="teal">·</span> Today</h1>
      <span class="day" id="day-date"></span>
    </header>
    <p class="sub">One prioritised list across your whole day — what needs you, and what has gone quiet.</p>

    <div class="token-bar">
      <input id="token" type="password" placeholder="paste dev bearer token" autocomplete="off" />
      <button id="save-token">Use token</button>
      <button id="reload" class="ghost">Reload</button>
    </div>

    <ul id="list"></ul>

    <div class="section-label">New commitment</div>
    <div class="new-form">
      <input class="name" id="c-name" placeholder="e.g. Weekly 1:1 with each report" />
      <span style="color:var(--text-tertiary);font-size:13px;">every</span>
      <input class="days" id="c-days" type="number" min="1" value="7" />
      <span style="color:var(--text-tertiary);font-size:13px;">days</span>
      <button class="primary" id="c-add">Add commitment</button>
    </div>
  </div>

  <div class="panel" id="panel">
    <button class="ghost close" id="panel-close">Close</button>
    <div id="panel-body"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = "/api/v1";
    let order = [];        // current client-side ordering: [{kind, item_id}]
    let itemsByKey = {};   // key -> item

    const keyOf = (it) => `${it.kind}:${it.item_id}`;
    const token = () => localStorage.getItem("dd_token") || "";
    const authHeaders = () => ({ "Authorization": `Bearer ${token()}`, "Content-Type": "application/json" });

    function toast(msg, isError) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast show" + (isError ? " error" : "");
      setTimeout(() => { t.className = "toast"; }, 2600);
    }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, { ...opts, headers: authHeaders() });
      if (res.status === 401) { toast("Not authenticated — paste a valid token", true); throw new Error("401"); }
      if (res.status === 403) { toast("Not authorised", true); throw new Error("403"); }
      if (!res.ok && res.status !== 204) { toast(`Error ${res.status}`, true); throw new Error(String(res.status)); }
      return res.status === 204 ? null : res.json();
    }

    async function loadToday() {
      if (!token()) { document.getElementById("list").innerHTML = '<li class="empty">Paste a dev token above to load your day.</li>'; return; }
      let data;
      try { data = await api("/daily-driver/today"); } catch { return; }
      document.getElementById("day-date").textContent = data.day_date;
      order = data.items.map((it) => ({ kind: it.kind, item_id: it.item_id }));
      itemsByKey = {};
      data.items.forEach((it) => { itemsByKey[keyOf(it)] = it; });
      render(data.items);
    }

    function render(items) {
      const list = document.getElementById("list");
      if (!items.length) { list.innerHTML = '<li class="empty">Nothing on your plate. Add a commitment below to start tracking a rhythm.</li>'; return; }
      list.innerHTML = "";
      items.forEach((it, idx) => {
        const li = document.createElement("li");
        li.className = "item " + it.status.toLowerCase();
        const isCommitment = it.kind === "COMMITMENT";
        const doneLabel = isCommitment ? "✓ Did it" : (it.done ? "↺ Undo" : "✓ Done");
        li.innerHTML = `
          <div class="reorder">
            <button class="ghost" data-up="${idx}" ${idx === 0 ? "disabled" : ""}>▲</button>
            <button class="ghost" data-down="${idx}" ${idx === items.length - 1 ? "disabled" : ""}>▼</button>
          </div>
          <span class="pill ${it.status.toLowerCase()}">${it.status.replace("_", " ")}</span>
          <div class="body">
            <div class="title">${escapeHtml(it.title)}</div>
            <div class="detail"><span class="kind-tag">${it.kind}</span> · ${escapeHtml(it.detail)}</div>
          </div>
          <div class="actions">
            <button data-done="${keyOf(it)}">${doneLabel}</button>
            <button class="ghost" data-open="${keyOf(it)}">Open</button>
          </div>`;
        list.appendChild(li);
      });
      list.querySelectorAll("[data-up]").forEach((b) => b.onclick = () => move(+b.dataset.up, -1));
      list.querySelectorAll("[data-down]").forEach((b) => b.onclick = () => move(+b.dataset.down, +1));
      list.querySelectorAll("[data-done]").forEach((b) => b.onclick = () => onDone(b.dataset.done));
      list.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openItem(b.dataset.open));
    }

    function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    async function move(idx, delta) {
      const j = idx + delta;
      if (j < 0 || j >= order.length) return;
      [order[idx], order[j]] = [order[j], order[idx]];
      try {
        await api("/daily-driver/today/order", { method: "PUT", body: JSON.stringify({ ordered: order }) });
        await loadToday();
      } catch {}
    }

    async function onDone(key) {
      const it = itemsByKey[key];
      try {
        if (it.kind === "COMMITMENT") {
          await api(`/daily-driver/commitments/${it.item_id}/completions`, { method: "POST" });
          toast("Logged — back on track");
        } else {
          await api("/daily-driver/today/done", { method: "POST", body: JSON.stringify({ kind: it.kind, item_id: it.item_id, done: !it.done }) });
        }
        await loadToday();
      } catch {}
    }

    async function openItem(key) {
      const it = itemsByKey[key];
      const body = document.getElementById("panel-body");
      if (it.kind === "CASE") {
        let detail;
        try { detail = await api(`/portfolio/cases/${it.item_id}`); }
        catch { return; }
        const c = detail.case || detail;
        const dps = (detail.data_points || []).map((dp) => `
          <div class="dp"><div class="dt">${escapeHtml(dp.data_point_type || "data point")}</div>${escapeHtml(JSON.stringify(dp.current_value || dp.value || {}))}</div>`).join("");
        body.innerHTML = `<div class="cell">${it.target_cell}</div><h2>${escapeHtml(c.title)}</h2>
          <p class="detail">Status: ${escapeHtml(c.status)}</p>
          <div class="section-label">Data points</div>${dps || '<p class="empty">No data points yet.</p>'}`;
      } else {
        body.innerHTML = `<div class="cell">${it.target_cell}</div><h2>${escapeHtml(it.title)}</h2>
          <p class="detail">${escapeHtml(it.detail)}</p>
          <p class="sub" style="margin-top:16px">A user-authored commitment. "Did it" logs a completion and clears the staleness signal.</p>`;
      }
      document.getElementById("panel").classList.add("open");
    }

    async function addCommitment() {
      const name = document.getElementById("c-name").value.trim();
      const days = parseInt(document.getElementById("c-days").value, 10);
      if (!name || !days || days < 1) { toast("Name and a positive interval needed", true); return; }
      try {
        await api("/daily-driver/commitments", { method: "POST", body: JSON.stringify({ name, expected_interval_days: days }) });
        document.getElementById("c-name").value = "";
        toast("Commitment added");
        await loadToday();
      } catch {}
    }

    document.getElementById("save-token").onclick = () => { localStorage.setItem("dd_token", document.getElementById("token").value.trim()); toast("Token saved"); loadToday(); };
    document.getElementById("reload").onclick = loadToday;
    document.getElementById("c-add").onclick = addCommitment;
    document.getElementById("panel-close").onclick = () => document.getElementById("panel").classList.remove("open");
    document.getElementById("c-name").addEventListener("keydown", (e) => { if (e.key === "Enter") addCommitment(); });

    document.getElementById("token").value = token();
    loadToday();
  </script>
</body>
</html>
