<!DOCTYPE html>
<!--
  The Padhanam app shell (D160, S60b) — the navigation frame the dogfooding
  loop lives in. Built from app-shell-mock.html against the brand tokens.
  The rail switches views; Today renders live inside the frame (the S60
  surface, D157/D158/D159); unbuilt surfaces render as honest placeholders
  (no dead links), defaulted out ahead of the Phase 2-A restraint week.

  Login-gated (D160): the page reads the platform JWT from localStorage
  (set by the login surface at /login) and redirects to /login if absent —
  the paste-a-dev-token backdoor (S58) is closed. The data routes stay
  bearer-authed; this page attaches the token to its fetches.
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Padhanam — Today</title>
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'SF Mono', Consolas, 'Cascadia Code', monospace;
      --ink-1: #1c1c1a; --ink-2: #5f5e5a; --ink-3: #888780;
      --page: #eceef0; --rail: #f4f5f7;
      --surface-work: #ffffff; --surface-personal: #faf6ec; --surface-2: #eceef0;
      --surface-hover-work: #f6f8fa; --surface-hover-personal: #f4eee0;
      --hairline: rgba(26,26,25,0.12); --hairline-strong: rgba(26,26,25,0.18);
      --navy: #2e3264; --navy-hover: #262a55; --teal: #1a8070;
      --on-track-bg: #eaf3de; --on-track-fg: #3b6d11;
      --needs-bg: #eeedfe; --needs-fg: #534ab7;
      --behind-bg: #faeeda; --behind-fg: #854f0b;
      --done-bg: #f0efec; --done-fg: #888780;
      --backdrop: rgba(0,0,0,0.2); --shadow-panel: 0 8px 28px rgba(0,0,0,0.18);
      --radius-row: 6px; --radius-card: 8px; --radius-input: 4px;
      --warm: #b0997e; --cool: #7a8190;
    }
    [data-theme="dark"] {
      --ink-1: #f0eeea; --ink-2: #b4b2a9; --ink-3: #888780;
      --page: #161614; --rail: #1b1b19;
      --surface-work: #232321; --surface-personal: #262320; --surface-2: #242422;
      --surface-hover-work: #2a2a28; --surface-hover-personal: #2d2924;
      --hairline: rgba(240,238,234,0.12); --hairline-strong: rgba(240,238,234,0.20);
      --navy: #3b4080; --navy-hover: #464c95; --teal: #2ba692;
      --on-track-bg: #1d2e0f; --on-track-fg: #8ea868;
      --needs-bg: #211d44; --needs-fg: #9f9ad0;
      --behind-bg: #3a2409; --behind-fg: #d3a05a;
      --done-bg: #242422; --done-fg: #8a8980;
      --backdrop: rgba(0,0,0,0.5); --shadow-panel: 0 8px 28px rgba(0,0,0,0.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
      color: var(--ink-1); background: var(--page); -webkit-font-smoothing: antialiased; }

    .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
    @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .rail { display: none; } }
    .rail { background: var(--rail); border-right: 1px solid var(--hairline);
      display: flex; flex-direction: column; padding: 16px 12px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 16px; color: var(--teal); }
    .brand svg { width: 24px; height: 24px; } .brand .nm { font-size: 15px; font-weight: 700; color: var(--ink-1); }
    .navgroup { margin-top: 10px; }
    .navlabel { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); padding: 6px 10px; }
    .navitem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-input);
      cursor: pointer; color: var(--ink-2); font-size: 13.5px; font-weight: 500; }
    .navitem:hover { background: var(--surface-2); color: var(--ink-1); }
    .navitem.on { background: color-mix(in srgb, var(--navy) 14%, transparent); color: var(--ink-1); font-weight: 600; }
    .navitem svg { width: 17px; height: 17px; flex-shrink: 0; }
    .railspace { flex: 1; }
    .acct { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-top: 1px solid var(--hairline);
      margin-top: 8px; cursor: pointer; border-radius: var(--radius-input); }
    .acct:hover { background: var(--surface-2); }
    .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff;
      display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .acct .who { flex: 1; min-width: 0; } .acct .who .n { font-size: 13px; font-weight: 600; }
    .acct .who .e { font-size: 11px; color: var(--ink-3); }

    .main { padding: 26px 30px 60px; max-width: 760px; }
    .topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .topline .controls { display: flex; align-items: center; gap: 14px; }
    .ctrl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--ink-3); display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .ctrl input[type="checkbox"] { accent-color: var(--teal); cursor: pointer; }
    .tbtn { font: inherit; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--ink-2); background: none; border: 1px solid var(--hairline-strong); border-radius: var(--radius-input);
      padding: 4px 10px; cursor: pointer; }
    .tbtn:hover { color: var(--ink-1); }

    .day-head { margin-bottom: 4px; display: flex; align-items: baseline; gap: 10px; }
    .day-head h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .day-head .date { font-size: 13px; color: var(--ink-2); }
    .sub { color: var(--ink-2); font-size: 13px; margin: 6px 0 14px; }

    .list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-radius: var(--radius-row);
      border: 1px solid var(--hairline); cursor: pointer; transition: background 0.14s ease, border-color 0.14s ease; }
    .row[data-tier="work"] { background: var(--surface-work); }
    .row[data-tier="personal"] { background: var(--surface-personal); }
    .row[data-tier="work"]:hover { background: var(--surface-hover-work); border-color: var(--hairline-strong); }
    .row[data-tier="personal"]:hover { background: var(--surface-hover-personal); border-color: var(--hairline-strong); }
    .row.is-done { opacity: 0.6; }
    .cue { flex-shrink: 0; height: 18px; color: var(--tint); display: inline-flex; align-items: center; gap: 3px; }
    .cue svg { width: 16px; height: 16px; display: block; }
    .cue-init { font-size: 10px; font-weight: 700; line-height: 1; }
    body.cue-off .cue { display: none; }
    .row .main-c { flex: 1; min-width: 0; }
    .row .title { font-size: 14px; font-weight: 600; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.is-done .title { text-decoration: line-through; }
    .row .meta { font-size: 12px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* D180: goal groups in the moat view */
    .group { margin-bottom: 14px; }
    .group-head { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
    .group-name { font-size: 13px; font-weight: 700; color: var(--ink-1); }
    .group-count { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
    .facet-cue { flex-shrink: 0; min-width: 34px; font-size: 13px; color: var(--ink-2); }
    .pill { flex-shrink: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      padding: 3px 9px; border-radius: 9999px; white-space: nowrap; }
    .pill.on_track { background: var(--on-track-bg); color: var(--on-track-fg); }
    .pill.needs_you { background: var(--needs-bg); color: var(--needs-fg); }
    .pill.behind { background: var(--behind-bg); color: var(--behind-fg); }
    .pill.done { background: var(--done-bg); color: var(--done-fg); }
    .section-label { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.07em;
      margin: 26px 0 8px; font-weight: 600; }
    .new-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--surface-work);
      border: 1px solid var(--hairline); border-radius: var(--radius-card); padding: 12px; }
    .new-form input { font-family: var(--font-sans); font-size: 13px; color: var(--ink-1); background: var(--page);
      border: 1px solid var(--hairline); border-radius: var(--radius-input); padding: 7px 9px; }
    .new-form input.name { flex: 1; min-width: 160px; } .new-form input.days { width: 64px; }
    .new-form .lbl { color: var(--ink-3); font-size: 13px; }
    .empty { color: var(--ink-3); font-style: italic; padding: 18px; text-align: center; }
    .placeholder { background: var(--surface-work); border: 1px dashed var(--hairline-strong);
      border-radius: var(--radius-card); padding: 36px; text-align: center; color: var(--ink-2); font-size: 13.5px; }
    .placeholder .ph-h { font-size: 15px; font-weight: 600; color: var(--ink-1); margin-bottom: 6px; }

    .btn-primary { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 15px; border: none;
      border-radius: var(--radius-input); background: var(--navy); color: #fff; cursor: pointer; }
    .btn-primary:hover { background: var(--navy-hover); }
    .btn-ghost { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 15px;
      border: 1px solid var(--hairline-strong); border-radius: var(--radius-input); background: none; color: var(--teal); cursor: pointer; }

    .backdrop { position: fixed; inset: 0; background: var(--backdrop); opacity: 0; pointer-events: none;
      transition: opacity 0.16s ease; z-index: 40; }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .panel { position: fixed; top: 0; right: 0; height: 100vh; width: 420px; max-width: 92vw;
      background: var(--surface-work); border-left: 1px solid var(--hairline); box-shadow: var(--shadow-panel);
      transform: translateX(100%); transition: transform 0.22s cubic-bezier(0.16,1,0.3,1);
      z-index: 50; display: flex; flex-direction: column; }
    .panel.open { transform: translateX(0); } .panel[data-tier="personal"] { background: var(--surface-personal); }
    .panel-top { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px;
      border-bottom: 1px solid var(--hairline); }
    .panel-top .ptitle { flex: 1; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-top .close { background: none; border: none; font-size: 18px; line-height: 1; color: var(--ink-3); cursor: pointer; padding: 4px; }
    .panel-top .close:hover { color: var(--ink-1); }
    .panel-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .panel-body .pill-row { display: flex; gap: 8px; align-items: center; }
    .panel-body .when { font-size: 12px; color: var(--ink-2); }
    .field-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin-bottom: 4px; }
    .field-value { font-size: 14px; color: var(--ink-1); }
    .panel-foot { flex-shrink: 0; padding: 14px 20px; border-top: 1px solid var(--hairline); display: flex; gap: 10px; }
    .thread { display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 92%; padding: 9px 12px; border-radius: var(--radius-card); font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .bubble.assistant { align-self: flex-start; background: var(--page); border: 1px solid var(--hairline); }
    .bubble.user { align-self: flex-end; background: var(--navy); border: 1px solid var(--navy); color: #fff; }
    .bubble.pending { opacity: 0.55; font-style: italic; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; align-self: flex-start; max-width: 92%; margin-top: -6px; }
    .chip { font-size: 10px; color: var(--ink-2); background: var(--page); border: 1px solid var(--hairline); border-radius: 9999px; padding: 2px 8px; }
    .chip .ct { color: var(--teal); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700; margin-right: 4px; }
    /* S61 (D162): expected-versus-observed gap + drop nudge + outcome form */
    .gap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .gap-cell { background: var(--page); border: 1px solid var(--hairline); border-radius: var(--radius-card); padding: 10px 12px; }
    .gap-cell .field-value { white-space: pre-wrap; word-wrap: break-word; }
    .gap-cell.empty-cell .field-value { color: var(--ink-3); font-style: italic; }
    .drop-nudge { font-size: 12px; color: var(--ink-2); background: var(--behind-bg); border: 1px solid var(--hairline);
      border-radius: 9999px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 6px; }
    .drop-nudge .dn-why { color: var(--behind-fg); font-weight: 600; }
    .row .drop-nudge { margin-top: 4px; }
    .outcome-form { display: flex; flex-direction: column; gap: 8px; background: var(--page);
      border: 1px solid var(--hairline); border-radius: var(--radius-card); padding: 12px; }
    .outcome-form textarea { font-family: var(--font-sans); font-size: 13px; color: var(--ink-1); background: var(--surface-work);
      border: 1px solid var(--hairline); border-radius: var(--radius-input); padding: 8px 10px; resize: vertical; min-height: 56px; }
    .outcome-form select { font-family: var(--font-sans); font-size: 13px; color: var(--ink-1); background: var(--surface-work);
      border: 1px solid var(--hairline); border-radius: var(--radius-input); padding: 7px 9px; }
    .outcome-form .of-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .composer { display: flex; gap: 8px; }
    .composer input { flex: 1; font-family: var(--font-sans); font-size: 13px; color: var(--ink-1); background: var(--page);
      border: 1px solid var(--hairline); border-radius: var(--radius-input); padding: 8px 10px; }
    .composer input:focus { outline: none; border-color: var(--teal); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface-work);
      border: 1px solid var(--hairline-strong); border-radius: var(--radius-card); padding: 10px 16px; font-size: 13px;
      z-index: 60; opacity: 0; transition: opacity 0.2s; pointer-events: none; box-shadow: var(--shadow-panel); }
    .toast.show { opacity: 1; } .toast.error { border-color: #d68e8e; color: #d68e8e; }
    @media (prefers-reduced-motion: reduce) { .panel, .backdrop, .row { transition: none; } }
  </style>
</head>
<body class="cue-on">
  <div class="app">
    <nav class="rail">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="11" cy="16" r="3.2" fill="currentColor"/><circle cx="21" cy="11" r="3.2" fill="currentColor"/><circle cx="21" cy="21" r="3.2" fill="currentColor"/><path d="M13.5 14.5 19 12 M13.5 17.5 19 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="nm">Padhanam</span>
      </div>
      <div class="navgroup" id="nav"></div>
      <div class="railspace"></div>
      <div class="navgroup" id="nav-foot"></div>
      <div class="acct" id="acct" title="Sign out">
        <div class="avatar" id="acct-av">·</div>
        <div class="who"><div class="n" id="acct-n">Signed in</div><div class="e">Sign out</div></div>
      </div>
    </nav>

    <main class="main">
      <div class="topline">
        <div class="controls-left" id="topline-left"></div>
        <div class="controls">
          <label class="ctrl" id="cueWrap" style="display:none"><input type="checkbox" id="cueToggle" checked /> Domain cue</label>
          <button class="tbtn" id="themeToggle">Light mode</button>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="panel" id="panel" data-tier="work">
    <div class="panel-top">
      <span class="cue" id="panel-cue"></span>
      <span class="ptitle" id="panel-title"></span>
      <button class="close" id="panel-close" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-foot" id="panel-foot" style="display:none"></div>
  </aside>
  <div class="toast" id="toast"></div>

  <script>
    const API = "/api/v1";
    const token = () => localStorage.getItem("dd_token") || "";
    // Login-gated (D160): no token → the login surface, not the paste backdoor.
    if (!token()) { window.location.href = "/login"; }
    const authHeaders = () => ({ "Authorization": `Bearer ${token()}`, "Content-Type": "application/json" });

    let itemsByKey = {};
    const ICON_WORK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    const ICON_HOME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>';
    const ICON_HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-9.5A3.5 3.5 0 0 1 12 7a3.5 3.5 0 0 1 7 3.5C19 15.5 12 20 12 20z"/></svg>';
    const DOMAINS = {
      work: { tier: "work", tint: "var(--cool)", icon: ICON_WORK },
      personal: { tier: "personal", tint: "var(--warm)", icon: ICON_HEART },
      family: { tier: "personal", tint: "var(--warm)", icon: ICON_HOME },
    };
    const domainOf = (it) => DOMAINS[it.domain] || DOMAINS.work;
    const pillLabel = (s) => ({ NEEDS_YOU: "Needs you", ON_TRACK: "On track", BEHIND: "Behind", DONE: "Done" }[s] || s);
    const keyOf = (it) => `${it.kind}:${it.item_id}`;

    // Nav: Today is live; unbuilt surfaces are honest placeholders (D160);
    // Connections is its own served page. Order mirrors app-shell-mock.
    const ICONS = {
      today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><circle cx="4" cy="7" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="17" r="1"/></svg>',
      week: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/><line x1="15" y1="9" x2="15" y2="21"/></svg>',
      dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14a4 4 0 1 0-4-4"/><path d="M5 19a9 9 0 1 1 14 0"/></svg>',
      journal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><line x1="8" y1="8" x2="15" y2="8"/><line x1="8" y1="12" x2="15" y2="12"/></svg>',
      map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="9" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="M8 7l8 1.5M8 16l1-7"/></svg>',
      connections: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a3 3 0 0 1 3-3h3a3 3 0 0 1 0 6h-1"/><path d="M15 12a3 3 0 0 1-3 3H9a3 3 0 0 1 0-6h1"/></svg>',
      settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5L3.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h5l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>',
    };
    const NAV = [
      { id: "today", label: "Today", live: true },
      { id: "week", label: "Week", placeholder: "The week matrix and week-range surfaces land after the dogfooding week informs their shape." },
      { id: "dash", label: "How am I doing", placeholder: "The dashboard verdict surface is defaulted out — one-line pull-in if day-one use shows it belongs in the loop." },
      { id: "journal", label: "Journal", placeholder: "The journal is a later P16 / Phase 2-B surface." },
      { id: "map", label: "Map & Flow", placeholder: "The causal Map and Flow graph views are Phase 2-B." },
    ];
    const NAV_FOOT = [
      { id: "connections", label: "Connections", href: "/connections" },
      { id: "settings", label: "Settings", placeholder: "The full settings surface (model, privacy, appearance) is a later slice; Connections is live." },
    ];

    function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
    function toast(msg, isError) { const t = document.getElementById("toast"); t.textContent = msg;
      t.className = "toast show" + (isError ? " error" : ""); setTimeout(() => { t.className = "toast"; }, 2600); }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, { ...opts, headers: authHeaders() });
      if (res.status === 401) { localStorage.removeItem("dd_token"); window.location.href = "/login"; throw new Error("401"); }
      if (res.status === 403) { toast("Not authorised", true); throw new Error("403"); }
      if (!res.ok && res.status !== 204) { toast(`Error ${res.status}`, true); throw new Error(String(res.status)); }
      return res.status === 204 ? null : res.json();
    }

    // --- nav + view switching ---

    // --- Today (S60 surface, live inside the shell) ---
    async function loadToday() {
      let data;
      try { data = await api("/daily-driver/today"); } catch { return; }
      const dd = document.getElementById("day-date"); if (dd) dd.textContent = data.day_date;
      itemsByKey = {}; data.items.forEach((it) => { itemsByKey[keyOf(it)] = it; });
      render(data.items);
      renderHistory(data.history || []);
    }
    // D175: the observed stream — completed/ended items today, off the live plan.
    function renderHistory(history) {
      const section = document.getElementById("history-section");
      const list = document.getElementById("history-list");
      if (!section || !list) return;
      if (!history.length) { section.style.display = "none"; list.innerHTML = ""; return; }
      section.style.display = "";
      list.innerHTML = "";
      history.forEach((it) => {
        const d = domainOf(it);
        const row = document.createElement("div");
        row.className = "row is-done"; row.dataset.tier = d.tier;
        row.innerHTML = `${cueHTML(it)}<div class="main-c"><div class="title">${escapeHtml(it.title)}</div>
          <div class="meta">${escapeHtml(it.detail)}</div></div>
          <span class="pill ${it.status.toLowerCase()}">${escapeHtml(pillLabel(it.status))}</span>`;
        list.appendChild(row);
      });
    }
    // --- Goals (S62, D163: the goal layer above commitments) ---
    async function loadGoals() {
      const box = document.getElementById("goals"); if (!box) return;
      let goals;
      try { goals = await api("/daily-driver/goals"); } catch { box.innerHTML = ""; return; }
      if (!goals.length) { box.innerHTML = '<div class="empty">No goals yet.</div>'; return; }
      box.innerHTML = "";
      goals.forEach((g) => box.appendChild(goalCard(g)));
    }
    function goalCard(g) {
      // The card reads the goal's shape: a sequence goal gets unblock-or-drop
      // over its chain, a progressive goal gets raise-or-hold (D163). No shared
      // path renders both.
      return g.remedy_kind === "unblock_or_drop" ? chainCard(g) : progressiveCard(g);
    }
    function progressiveCard(g) {
      const card = document.createElement("div");
      card.className = "row"; card.dataset.tier = "work";
      card.style.flexDirection = "column"; card.style.alignItems = "stretch"; card.style.gap = "6px";
      const raise = g.recommendation === "raise";
      const rec = raise
        ? `<span style="color:#1a7f4b;font-weight:600">↑ Raise</span>`
        : `<span style="color:#8a8a8a;font-weight:600">→ Hold</span>`;
      const btn = (raise && g.next_target)
        ? `<button class="btn-primary" data-oid="${g.outcome_id}" data-next="${escapeHtml(g.next_target)}">Raise target to ${escapeHtml(g.next_target)}</button>`
        : "";
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <strong>${escapeHtml(g.name)}</strong>
          <span class="sub" style="margin:0">target: <strong>${escapeHtml(g.current_target || "—")}</strong></span>
        </div>
        <div class="sub" style="margin:0">Progress — ${escapeHtml(g.progress_summary)}</div>
        <div class="sub" style="margin:0">Gap — ${escapeHtml(g.gap_summary)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span class="sub" style="margin:0">Recommendation: ${rec} — ${escapeHtml(g.reason)}</span>
          ${btn}
        </div>`;
      const b = card.querySelector("button[data-oid]");
      if (b) b.onclick = () => raiseTarget(b.dataset.oid, b.dataset.next);
      return card;
    }
    function stepGlyph(state, active) {
      if (state === "done") return "✓";
      if (state === "dropped") return "✕";
      if (state === "blocked") return active ? "⚠" : "⋯";
      return active ? "▶" : "○"; // ready
    }
    function chainCard(g) {
      const card = document.createElement("div");
      card.className = "row"; card.dataset.tier = "work";
      card.style.flexDirection = "column"; card.style.alignItems = "stretch"; card.style.gap = "6px";
      const intervene = g.recommendation === "unblock" || g.recommendation === "drop";
      const rec = intervene
        ? `<span style="color:#b4690e;font-weight:600">⚠ Unblock or drop</span>`
        : `<span style="color:#8a8a8a;font-weight:600">→ Continue</span>`;
      const steps = (g.steps || []).map((s) => {
        const w = s.is_active ? "font-weight:600" : "";
        const dim = (s.state === "done" || s.state === "dropped") ? "opacity:.6" : "";
        return `<div class="sub" style="margin:0;${w};${dim}">${stepGlyph(s.state, s.is_active)} ${escapeHtml(s.name)} <span style="color:#8a8a8a">(${escapeHtml(s.state)})</span></div>`;
      }).join("");
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <strong>${escapeHtml(g.name)}</strong>
          <span class="sub" style="margin:0">terminal: <strong>${escapeHtml(g.terminal_target || "—")}</strong> <span style="color:#8a8a8a">(${escapeHtml(g.terminal_state || "—")})</span></span>
        </div>
        <div style="margin:2px 0">${steps}</div>
        <div class="sub" style="margin:0">Chain — ${escapeHtml(g.progress_summary)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span class="sub" style="margin:0">Recommendation: ${rec} — ${escapeHtml(g.reason)}</span>
        </div>`;
      return card;
    }
    async function raiseTarget(outcomeId, next) {
      try {
        await api(`/daily-driver/goals/${outcomeId}/raise-target`, { method: "POST" });
        toast(`Target raised to ${next}`);
        await loadGoals();
      } catch (e) { toast("Could not raise the target", true); }
    }
    // --- Tasks (S65, D167: ingested Google Tasks, read-only, own view) ---
    async function loadTasks() {
      const box = document.getElementById("tasks"); if (!box) return;
      let tasks;
      try { tasks = await api("/daily-driver/tasks"); } catch { box.innerHTML = ""; return; }
      if (!tasks.length) { box.innerHTML = '<div class="empty">No tasks ingested yet. Connect Google Tasks to read them here.</div>'; return; }
      box.innerHTML = "";
      tasks.forEach((t) => box.appendChild(taskCard(t)));
    }
    function taskCard(t) {
      const card = document.createElement("div");
      card.className = "row"; card.dataset.tier = "work";
      card.style.flexDirection = "column"; card.style.alignItems = "stretch"; card.style.gap = "4px";
      const done = t.status === "completed";
      const glyph = done ? "✓" : "○";
      const due = t.due_at ? new Date(t.due_at).toLocaleDateString() : null;
      const titleStyle = done ? "opacity:.6;text-decoration:line-through" : "";
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <strong style="${titleStyle}">${glyph} ${escapeHtml(t.title || "(untitled task)")}</strong>
          <span class="sub" style="margin:0">${due ? "due " + escapeHtml(due) : ""}</span>
        </div>
        ${t.notes ? `<div class="sub" style="margin:0">${escapeHtml(t.notes)}</div>` : ""}
        <div class="sub" style="margin:0;color:#8a8a8a">list: ${escapeHtml(t.tasklist_title || t.tasklist_id)}</div>`;
      return card;
    }
    // --- Units of work (S66, D168: cross-tool correlation, read-only) ---
    const FACET_GLYPH = { task: "✓", meeting: "📅", email: "✉" };
    // D180 — the moat view anchored on the goal served: units grouped under
    // the goal they serve, orphans under one "unlinked" group. Domain rides
    // the group (colour + category icon); each unit row carries one signal per
    // channel (design-language §2): colour = tier, icon = facet category, no
    // initials (no cluster yet), status in one pill, meta bare.
    async function loadUnitsByGoal() {
      const box = document.getElementById("moat"); if (!box) return;
      let g;
      try { g = await api("/daily-driver/units-by-goal"); } catch { box.innerHTML = ""; return; }
      const cov = g.coverage || {goals_total:0, goals_covered:0, units_total:0, units_linked:0, has_coverage:false};
      box.innerHTML = "";
      // Lead with the coverage boundary — the read is only valid inside it (D171).
      const cline = document.createElement("div");
      cline.className = "sub"; cline.style.margin = "0 0 8px";
      cline.innerHTML = `<strong>Coverage:</strong> ${cov.goals_covered} of ${cov.goals_total} goals linked to ingested work · ${cov.units_linked} of ${cov.units_total} units linked.`;
      box.appendChild(cline);
      if (!cov.has_coverage) {
        const note = document.createElement("div");
        note.className = "empty";
        note.textContent = "No goals are linked to ingested work yet, so the grouped read is unproven and withheld. Connect where the work lives (pull tasks, then correlate) — or tune the lever names to match how you title it.";
        box.appendChild(note);
        return;
      }
      (g.groups || []).forEach((grp) => box.appendChild(goalGroupEl(grp)));
      if (g.unlinked && g.unlinked.length) {
        box.appendChild(groupEl("Unlinked", "work", null,
          `${g.unlinked.length} not linked to any goal`, g.unlinked, true));
      }
    }
    function goalGroupEl(grp) {
      const d = DOMAINS[grp.domain] || DOMAINS.work;
      const n = grp.units.length;
      return groupEl(grp.name, d.tier, d, `${n} unit${n === 1 ? "" : "s"}`, grp.units, false);
    }
    function groupEl(name, tier, domain, countLabel, units, unlinked) {
      const wrap = document.createElement("div");
      wrap.className = "group";
      const head = document.createElement("div");
      head.className = "group-head";
      const cue = domain ? `<span class="cue" style="--tint:${domain.tint}">${domain.icon}</span>` : "";
      head.innerHTML = `${cue}<span class="group-name">${escapeHtml(name)}</span><span class="group-count">${escapeHtml(countLabel)}</span>`;
      wrap.appendChild(head);
      units.forEach((u) => wrap.appendChild(moatRow(u, tier, unlinked)));
      return wrap;
    }
    function moatRow(u, tier, unlinked) {
      const row = document.createElement("div");
      row.className = "row"; row.dataset.tier = tier;
      const glyphs = (u.facet_types || []).map((t) => FACET_GLYPH[t] || "•").join(" ");
      const bits = [];
      if (u.instance_count > 1) bits.push(`×${u.instance_count}`);
      bits.push(`${u.facet_count} facet${u.facet_count === 1 ? "" : "s"}`);
      // One status pill: a candidate link is the suggestion-to-confirm; a
      // confirmed link is the settled default and carries no pill.
      const pill = (!unlinked && !u.confirmed) ? `<span class="pill needs_you">suggested</span>` : "";
      row.innerHTML = `<span class="facet-cue">${glyphs || "•"}</span><div class="main-c">` +
        `<div class="title">${escapeHtml(u.title)}</div>` +
        `<div class="meta">${escapeHtml(bits.join(" · "))}</div></div>${pill}`;
      return row;
    }
    // (D180: the former flat "Units of work" panel and the coverage-stats "How
    // am I doing" panel are collapsed into loadUnitsByGoal above — the moat read
    // anchored on the goal served. Coverage + uncovered ride the coverage line.)
    // --- Suggestions (S68, D170: missing-facet, credulity-gated, recommendation-shaped) ---
    const SUGGEST_GLYPH = { block: "⧗", satellite_work: "✎", candidate_task: "✓" };
    async function loadSuggestions() {
      const box = document.getElementById("suggestions"); if (!box) return;
      let items;
      try { items = await api("/daily-driver/suggestions"); } catch { box.innerHTML = ""; return; }
      if (!items.length) {
        box.innerHTML = '<div class="empty">Nothing to suggest right now. (Suggestions surface only for goal-serving work missing a facet — silence is the default.)</div>';
        return;
      }
      box.innerHTML = "";
      items.forEach((s) => {
        const card = document.createElement("div");
        card.className = "row"; card.dataset.tier = "work";
        card.style.flexDirection = "column"; card.style.alignItems = "stretch"; card.style.gap = "2px";
        const glyph = SUGGEST_GLYPH[s.kind] || "·";
        card.innerHTML = `<div class="sub" style="margin:0">${glyph} ${escapeHtml(s.suggestion)}</div>`;
        box.appendChild(card);
      });
    }
    function cueHTML(it) { const d = domainOf(it); return `<span class="cue" style="--tint:${d.tint}">${d.icon}</span>`; }
    function render(items) {
      const list = document.getElementById("list"); if (!list) return;
      if (!items.length) { list.innerHTML = '<div class="empty">Nothing on your plate. Connect a calendar or add a commitment below.</div>'; return; }
      list.innerHTML = "";
      // S84: rows render in the system's proposed order (the read's order). The
      // per-row reorder chevrons are removed for the legibility pass; the full
      // hybrid override (drag/bump/pin/park, design-language §5) is post-week.
      // The per-day position/order read + /today/order endpoint are untouched.
      items.forEach((it) => {
        const d = domainOf(it);
        const row = document.createElement("div");
        row.className = "row" + (it.done ? " is-done" : ""); row.dataset.tier = d.tier;
        const nudge = it.drop_candidate ? `<div class="drop-nudge"><span class="dn-why">gone quiet</span> drop it?</div>` : "";
        row.innerHTML = `${cueHTML(it)}<div class="main-c"><div class="title">${escapeHtml(it.title)}</div>
          <div class="meta">${escapeHtml(it.detail)}</div>${nudge}</div>
          <span class="pill ${it.status.toLowerCase()}">${escapeHtml(pillLabel(it.status))}</span>`;
        row.addEventListener("click", () => openItem(keyOf(it)));
        list.appendChild(row);
      });
    }
    async function onDone(key) {
      const it = itemsByKey[key];
      try {
        if (it.kind === "COMMITMENT") { await api(`/daily-driver/commitments/${it.item_id}/completions`, { method: "POST" }); toast("Logged — back on track"); }
        else { await api("/daily-driver/today/done", { method: "POST", body: JSON.stringify({ kind: it.kind, item_id: it.item_id, done: !it.done }) }); }
        closePanel(); await loadToday();
      } catch {}
    }

    let convState = null, convThread = [];
    const CONVERSATIONAL = { CASE: "CASE", CALENDAR: "CALENDAR" };
    function setPanelChrome(it) { const d = domainOf(it);
      document.getElementById("panel").dataset.tier = d.tier;
      document.getElementById("panel-cue").style.setProperty("--tint", d.tint);
      document.getElementById("panel-cue").innerHTML = d.icon;
      document.getElementById("panel-title").textContent = it.title; }
    function openItem(key) {
      const it = itemsByKey[key]; const foot = document.getElementById("panel-foot");
      setPanelChrome(it);
      document.getElementById("panel").classList.add("open"); document.getElementById("backdrop").classList.add("open");
      if (CONVERSATIONAL[it.kind]) {
        openConversation(it);
        if (it.kind === "CASE") { foot.style.display = "flex";
          foot.innerHTML = `<button class="btn-ghost" id="foot-done">${it.done ? "Undo done" : "Mark done"}</button>`;
          document.getElementById("foot-done").onclick = () => onDone(key);
        } else { foot.style.display = "none"; }
      } else {
        convState = null;
        document.getElementById("panel-body").innerHTML = commitmentDetailHTML(it);
        wireOutcomeForm(key, it);
        foot.style.display = "flex"; foot.innerHTML = `<button class="btn-primary" id="foot-done">Did it</button>`;
        document.getElementById("foot-done").onclick = () => onDone(key);
      }
    }
    const OUTCOME_STATUSES = [["met","Met"],["partial","Partial"],["missed","Missed"],["changed","Changed"],["dropped","Dropped — let it go"]];
    function statusLabel(s) { const m = OUTCOME_STATUSES.find((o) => o[0] === s); return m ? m[1] : s; }
    function commitmentDetailHTML(it) {
      const statusBadge = it.outcome_status ? `<span class="chip"><span class="ct">outcome</span>${escapeHtml(statusLabel(it.outcome_status))}</span>` : "";
      const nudge = it.drop_candidate ? `<span class="drop-nudge"><span class="dn-why">gone quiet — no recent progress</span> drop it?</span>` : "";
      const expected = it.expected_outcome
        ? `<div class="gap-cell"><div class="field-label">Expected</div><div class="field-value">${escapeHtml(it.expected_outcome)}</div></div>`
        : `<div class="gap-cell empty-cell"><div class="field-label">Expected</div><div class="field-value">none captured</div></div>`;
      const observed = it.observed_outcome
        ? `<div class="gap-cell"><div class="field-label">Observed</div><div class="field-value">${escapeHtml(it.observed_outcome)}</div></div>`
        : `<div class="gap-cell empty-cell"><div class="field-label">Observed</div><div class="field-value">not yet recorded</div></div>`;
      const options = OUTCOME_STATUSES.map((o) => `<option value="${o[0]}" ${it.outcome_status === o[0] ? "selected" : ""}>${escapeHtml(o[1])}</option>`).join("");
      return `<div class="pill-row"><span class="pill ${it.status.toLowerCase()}">${escapeHtml(pillLabel(it.status))}</span>${statusBadge}${nudge}</div>
        <div><div class="field-label">Cadence</div><div class="field-value">${escapeHtml(it.detail)}</div></div>
        <div class="gap-grid">${expected}${observed}</div>
        <div class="outcome-form">
          <div class="field-label">Record what transpired</div>
          <textarea id="o-text" placeholder="What actually happened? (optional)">${it.observed_outcome ? escapeHtml(it.observed_outcome) : ""}</textarea>
          <div class="of-row"><select id="o-status">${options}</select><button class="btn-ghost" id="o-save">Save outcome</button></div>
        </div>
        <p class="sub">“Did it” logs a completion (clears the staleness signal). “Save outcome” records what came of it against what you expected — the gap, not just the tick.</p>`;
    }
    function wireOutcomeForm(key, it) {
      const save = document.getElementById("o-save"); if (!save) return;
      save.onclick = () => recordObserved(key);
    }
    async function recordObserved(key) {
      const it = itemsByKey[key];
      const text = document.getElementById("o-text").value.trim();
      const status = document.getElementById("o-status").value;
      const body = { outcome_status: status }; if (text) body.observed_outcome = text;
      try {
        await api(`/daily-driver/commitments/${it.item_id}/observed-outcome`, { method: "POST", body: JSON.stringify(body) });
        toast(status === "dropped" ? "Dropped — off your plate" : "Outcome recorded");
        await loadToday();
        const fresh = itemsByKey[key];
        if (fresh) { document.getElementById("panel-body").innerHTML = commitmentDetailHTML(fresh); wireOutcomeForm(key, fresh); }
        else closePanel();
      } catch {}
    }
    async function openConversation(it) {
      convState = null; convThread = [];
      const when = it.start_at ? new Date(it.start_at).toLocaleString() : it.detail;
      document.getElementById("panel-body").innerHTML = `<div class="pill-row">
          <span class="pill ${it.status.toLowerCase()}">${escapeHtml(pillLabel(it.status))}</span><span class="when">${escapeHtml(when)}</span></div>
        <div class="thread" id="thread"><div class="bubble assistant pending">Opening…</div></div>
        <div class="composer"><input id="turn-input" placeholder="Ask about this…" autocomplete="off" disabled /><button class="btn-primary" id="turn-send" disabled>Send</button></div>`;
      let turn;
      try { turn = await api("/daily-driver/conversation/open", { method: "POST", body: JSON.stringify({ focus_kind: it.kind, focus_id: it.item_id }) }); }
      catch { renderThread(); return; }
      applyTurn(null, turn); wireComposer();
    }
    function applyTurn(userText, turn) {
      convThread = convThread.filter((t) => !t.pending);
      if (userText !== null) convThread.push({ role: "user", text: userText, citations: [] });
      convThread.push({ role: "assistant", text: turn.reply, citations: turn.citations || [] });
      convState = turn.state; renderThread();
    }
    function renderThread() {
      const thread = document.getElementById("thread"); if (!thread) return; thread.innerHTML = "";
      convThread.forEach((t) => {
        const b = document.createElement("div"); b.className = "bubble " + t.role + (t.pending ? " pending" : ""); b.textContent = t.text; thread.appendChild(b);
        if (t.role === "assistant" && t.citations && t.citations.length) {
          const chips = document.createElement("div"); chips.className = "chips";
          chips.innerHTML = t.citations.map((c) => `<span class="chip"><span class="ct">${escapeHtml(c.type)}</span>${escapeHtml(c.label)}</span>`).join("");
          thread.appendChild(chips);
        }
      });
      thread.scrollTop = thread.scrollHeight;
    }
    function wireComposer() {
      const input = document.getElementById("turn-input"), send = document.getElementById("turn-send");
      if (!input || !send) return; input.disabled = false; send.disabled = false; input.focus();
      send.onclick = sendTurn; input.onkeydown = (e) => { if (e.key === "Enter") sendTurn(); };
    }
    async function sendTurn() {
      const input = document.getElementById("turn-input"); const text = input.value.trim();
      if (!text || !convState) return; input.value = "";
      convThread.push({ role: "user", text, citations: [] }); convThread.push({ role: "assistant", text: "…", citations: [], pending: true }); renderThread();
      let turn;
      try { turn = await api("/daily-driver/conversation/turn", { method: "POST", body: JSON.stringify({ state: convState, text }) }); }
      catch { convThread = convThread.filter((t) => !t.pending); renderThread(); return; }
      applyTurn(null, turn);
    }
    async function addCommitment() {
      const name = document.getElementById("c-name").value.trim(); const days = parseInt(document.getElementById("c-days").value, 10);
      const expected = document.getElementById("c-expected").value.trim();
      if (!name || !days || days < 1) { toast("Name and a positive interval needed", true); return; }
      const body = { name, expected_interval_days: days };
      if (expected) body.expected_outcome = expected;
      try { await api("/daily-driver/commitments", { method: "POST", body: JSON.stringify(body) });
        document.getElementById("c-name").value = ""; document.getElementById("c-expected").value = "";
        toast("Commitment added"); await loadToday(); } catch {}
    }
    function closePanel() { document.getElementById("panel").classList.remove("open"); document.getElementById("backdrop").classList.remove("open"); }

    document.getElementById("panel-close").onclick = closePanel;
    document.getElementById("backdrop").onclick = closePanel;
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
    document.getElementById("cueToggle").addEventListener("change", (e) => { document.body.classList.toggle("cue-off", !e.target.checked); });
    document.getElementById("acct").onclick = () => { localStorage.removeItem("dd_token"); window.location.href = "/login"; };
    const themeBtn = document.getElementById("themeToggle");
    themeBtn.onclick = () => { const dark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark"); themeBtn.textContent = dark ? "Dark mode" : "Light mode"; };

    renderNav(); renderView();
  </script>
</body>
</html>
