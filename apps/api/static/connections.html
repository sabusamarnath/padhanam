<!DOCTYPE html>
<!--
  Connections page (D159, design-language §9) — the in-product surface
  where the operator connects Google Calendar one-tap. Self-contained:
  vanilla JS, no build step. Built from design-language §9 plus the
  app-shell Connected accounts view (charter/mocks/app-shell-mock.html);
  there is no connections-mock.html (the standalone connections mock is
  personal and intentionally excluded — the doc is binding).

  Intake is read-only and says so plainly (calendar.readonly, D148): the
  product reads, it does not write or send. A connected calendar carries a
  domain tag (work/personal/family) its events inherit on the Today
  surface; at single-calendar scale the tag is one connection-level
  default surfaced read-only (D159, the two-threshold rule). The OAuth
  connect itself is operator-gated (the self-hosted Nango connect flow);
  this page reports state and carries the read-only posture.

  Served at /connections (auth-exempt); the page prompts for a dev bearer
  token and attaches it to the authenticated fetch to /api/v1/connections.
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Padhanam — Connections</title>
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ink-1: #1c1c1a; --ink-2: #5f5e5a; --ink-3: #888780;
      --page: #eceef0; --surface-work: #ffffff;
      --hairline: rgba(26,26,25,0.12); --hairline-strong: rgba(26,26,25,0.18);
      --navy: #2e3264; --navy-hover: #262a55; --teal: #1a8070;
      --on-track-bg: #eaf3de; --on-track-fg: #3b6d11;
      --done-bg: #f0efec; --done-fg: #888780;
      --shadow-panel: 0 8px 28px rgba(0,0,0,0.18);
      --radius-card: 8px; --radius-input: 4px;
    }
    [data-theme="dark"] {
      --ink-1: #f0eeea; --ink-2: #b4b2a9; --ink-3: #888780;
      --page: #161614; --surface-work: #232321;
      --hairline: rgba(240,238,234,0.12); --hairline-strong: rgba(240,238,234,0.20);
      --navy: #3b4080; --navy-hover: #464c95; --teal: #2ba692;
      --on-track-bg: #1d2e0f; --on-track-fg: #8ea868;
      --done-bg: #242422; --done-fg: #8a8980;
      --shadow-panel: 0 8px 28px rgba(0,0,0,0.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
      color: var(--ink-1); background: var(--page); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    .topbar { height: 48px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; background: var(--surface-work); border-bottom: 1px solid var(--hairline);
      position: sticky; top: 0; z-index: 10; }
    .topbar .brand { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
    .topbar .brand .teal { color: var(--teal); }
    .topbar a { font-size: 12px; color: var(--ink-2); text-decoration: none; }
    .topbar a:hover { color: var(--ink-1); }
    .topbar .controls { display: flex; align-items: center; gap: 14px; }
    .topbar button { font: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--ink-2); background: none; border: 1px solid var(--hairline-strong);
      border-radius: var(--radius-input); padding: 3px 9px; cursor: pointer; }

    .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .date { font-size: 13px; color: var(--ink-2); margin-bottom: 18px; }

    .token-bar { display: flex; gap: 8px; margin: 10px 0 18px; padding: 8px;
      background: var(--surface-work); border: 1px solid var(--hairline); border-radius: var(--radius-card); }
    .token-bar input { flex: 1; font-family: var(--font-sans); font-size: 13px; color: var(--ink-1);
      background: var(--page); border: 1px solid var(--hairline); border-radius: var(--radius-input); padding: 7px 9px; }
    .token-bar input:focus { outline: none; border-color: var(--teal); }
    .btn-primary { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 15px; border: none;
      border-radius: var(--radius-input); background: var(--navy); color: #fff; cursor: pointer; }
    .btn-primary:hover { background: var(--navy-hover); }
    .btn-conn { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 13px;
      border: 1px solid var(--hairline-strong); border-radius: var(--radius-input);
      background: none; color: var(--ink-1); cursor: pointer; }
    .btn-conn:hover { border-color: var(--teal); color: var(--teal); }

    .card { background: var(--surface-work); border: 1px solid var(--hairline);
      border-radius: var(--radius-card); padding: 16px; margin-bottom: 14px; }
    .card-h { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .card-sub { font-size: 12px; color: var(--ink-2); margin-bottom: 12px; }
    .conn-note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2);
      margin-bottom: 12px; }
    .gdot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }

    .conn { display: flex; align-items: center; gap: 12px; padding: 12px 0;
      border-top: 1px solid var(--hairline); }
    .conn:first-of-type { border-top: none; }
    .conn .ico { width: 30px; height: 30px; flex-shrink: 0; color: var(--ink-2);
      display: inline-flex; align-items: center; justify-content: center; }
    .conn .ico svg { width: 22px; height: 22px; }
    .conn .ci { flex: 1; min-width: 0; }
    .conn .cn { font-size: 14px; font-weight: 600; }
    .conn .cd { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
    .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      padding: 2px 8px; border-radius: 9999px; white-space: nowrap; }
    .badge.read-only { background: var(--done-bg); color: var(--done-fg); }
    .badge.connected { background: var(--on-track-bg); color: var(--on-track-fg); }
    .conn.not-wired { opacity: 0.72; }

    .manage { margin-top: 6px; margin-left: 42px; padding: 12px;
      background: var(--page); border: 1px solid var(--hairline); border-radius: var(--radius-input); }
    .manage-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--ink-3); margin-bottom: 8px; }
    .cal-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .cal-row input { accent-color: var(--teal); }
    .domain-tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--ink-2); background: var(--surface-work); border: 1px solid var(--hairline);
      border-radius: 9999px; padding: 2px 9px; margin-left: auto; }
    .empty { color: var(--ink-3); font-style: italic; padding: 18px; text-align: center; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface-work); border: 1px solid var(--hairline-strong); border-radius: var(--radius-card);
      padding: 10px 16px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity 0.2s;
      pointer-events: none; box-shadow: var(--shadow-panel); }
    .toast.show { opacity: 1; }
    .toast.error { color: #d68e8e; border-color: #d68e8e; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Padhanam <span class="teal">·</span> Connections</div>
    <div class="controls">
      <a href="/app">← Today</a>
      <button id="themeToggle">Light mode</button>
    </div>
  </div>

  <div class="wrap">
    <h1>Connections</h1>
    <div class="date">Connect a calendar so your day flows onto the Today surface.</div>

    <div class="token-bar">
      <input id="token" type="password" placeholder="paste dev bearer token" autocomplete="off" />
      <button class="btn-primary" id="save-token">Use token</button>
    </div>

    <div class="card">
      <div class="card-h">Connected accounts</div>
      <div class="conn-note"><span class="gdot"></span>You signed in with Google, so your Google apps connect in one step.</div>
      <div id="conn-list"><div class="empty">Paste a dev token above to see your connections.</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = "/api/v1";
    const token = () => localStorage.getItem("dd_token") || "";
    const authHeaders = () => ({ "Authorization": `Bearer ${token()}`, "Content-Type": "application/json" });

    const I = {
      cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>',
      mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>',
      drive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l5 9-4 7H7L3 12z"/></svg>',
    };
    const ICON = { "google-calendar": I.cal, "google-mail": I.mail, "google-drive": I.drive };

    function toast(msg, isError) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.className = "toast show" + (isError ? " error" : "");
      setTimeout(() => { t.className = "toast"; }, 2600);
    }
    function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

    async function api(path) {
      const res = await fetch(API + path, { headers: authHeaders() });
      if (res.status === 401) { toast("Not authenticated — paste a valid token", true); throw new Error("401"); }
      if (res.status === 403) { toast("Not authorised", true); throw new Error("403"); }
      if (!res.ok) { toast(`Error ${res.status}`, true); throw new Error(String(res.status)); }
      return res.json();
    }

    async function load() {
      if (!token()) { document.getElementById("conn-list").innerHTML = '<div class="empty">Paste a dev token above to see your connections.</div>'; return; }
      let data;
      try { data = await api("/connections"); } catch { return; }
      render(data);
    }

    function connRow(c, primary) {
      const ico = ICON[c.provider] || I.cal;
      const badge = c.connected
        ? '<span class="badge connected">Connected</span>'
        : (c.read_only_scope ? `<span class="badge read-only">Read-only · ${escapeHtml(c.read_only_scope)}</span>` : "");
      const action = c.connected
        ? '<button class="btn-conn">Disconnect</button>'
        : '<button class="btn-conn" data-connect="' + escapeHtml(c.provider) + '">Connect</button>';
      const note = (!primary && !c.list_wired)
        ? '<div class="cd">Connectable — not yet wired into the Today list.</div>' : "";
      let html = `<div class="conn ${c.connected ? "" : "not-wired"}" data-id="${escapeHtml(c.provider)}">
        <span class="ico">${ico}</span>
        <div class="ci"><div class="cn">${escapeHtml(c.name)}</div>
          <div class="cd">${primary ? "Events flow onto your day, read-only." : "Read-only intake."}</div>${note}</div>
        ${badge}${action}</div>`;
      // The calendars-to-include manage panel, with the domain tag (D159, §9).
      if (c.connected && primary) {
        html += `<div class="manage">
          <div class="manage-h">Calendars to include</div>
          <div class="cal-row">
            <input type="checkbox" checked disabled />
            <span>Primary calendar</span>
            <span class="domain-tag">${escapeHtml(c.domain_tag || "work")}</span>
          </div>
        </div>`;
      }
      return html;
    }

    function render(data) {
      const list = document.getElementById("conn-list");
      const rows = [connRow(data.calendar, true)]
        .concat((data.others || []).map((o) => connRow(o, false)));
      list.innerHTML = rows.join("");
      // Connect is operator-gated (the Nango connect flow happens out of
      // band; AC8). The button explains rather than mints a token here.
      list.querySelectorAll("[data-connect]").forEach((b) => b.onclick = () =>
        toast("Connect Google Calendar via the Nango connect flow, then reload."));
    }

    document.getElementById("save-token").onclick = () => { localStorage.setItem("dd_token", document.getElementById("token").value.trim()); toast("Token saved"); load(); };
    const themeBtn = document.getElementById("themeToggle");
    themeBtn.onclick = () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
      themeBtn.textContent = dark ? "Dark mode" : "Light mode";
    };
    document.getElementById("token").value = token();
    load();
  </script>
</body>
</html>
