[project]
name = "padhanam-ingestion"
version = "0.0.0"
description = "Ingestion bounded context (D60). Source upload, parsing, embedding, graph extraction, and retrieval. S19 lands the foundations: bounded-context skeleton, sources/chunks domain plus repository, parser port with markdown and plain-text adapters, register-source use case, and the parse-source worker loop with Postgres SKIP LOCKED queue."
requires-python = ">=3.14"
# S19: SQLAlchemy + asyncpg for the Postgres source/chunk repository
# adapter (D32 per-tenant Postgres). markdown-it-py for the markdown
# parser adapter per D61's library choice. Domain code stays pure
# (D16) — these deps are declared here per D30's per-context dep-
# scoping invariant.
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "markdown-it-py>=3.0",
    # S20 / D62: LiteLLM is the embedder gateway too. Vendor
    # isolation holds — the only place ``litellm`` enters the
    # ingestion context is ``adapters/outbound/embedding/``. The
    # litellm-confined import-linter contract extends to admit this
    # second adapter directory alongside inference's outbound/litellm.
    "litellm>=1.83.7,<2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-semantic-conventions>=0.48b0",
    # S21 / D63: the Neo4j Python async driver enters the ingestion
    # context only through ``adapters/outbound/neo4j/``; the
    # ``neo4j-confined`` import-linter contract plus the AST
    # enforcement test at ``tests/_enforcement/test_no_raw_neo4j_session.py``
    # fence the boundary mechanically. The dep is also declared at
    # the root pyproject for the ``ops.migrate_neo4j`` Cypher
    # migration runner; declaring per-context here keeps D30's
    # per-context dep-scoping invariant honest.
    "neo4j>=5.26,<6",
]

[tool.uv]
package = false
