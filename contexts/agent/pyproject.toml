[project]
name = "padhanam-agent"
version = "0.0.0"
description = "Agent bounded context (D31, D32, D75). AgentTemplate plus AgentRevision aggregates with hash-chain integrity per D26 inheriting D74's audit-mirror shape; per-tenant Postgres persistence per D32; tenant-context-or-operator-context CRUD use cases per D75. Substrate for the create_agent_from_methodology flow at S25 and the agent runtime at P8."
requires-python = ">=3.14"
# Postgres adapter scope (S24 commit 7). Mirrors the methodology
# precedent at D74: sqlalchemy[asyncio] for the AsyncEngine + Core
# query surface, asyncpg as the driver. Domain code is pure per D16;
# the deps live here because the adapter declares them per D30's
# per-context dep-scoping invariant.
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[tool.uv]
package = false
