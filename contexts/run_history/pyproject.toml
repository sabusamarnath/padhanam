[project]
name = "padhanam-run-history"
version = "0.0.0"
description = "Run-history bounded context (D94, D95). Per-tenant Postgres substrate for the structured run record and citation linking; consumer of the agent runtime's terminal events via the RunHistoryWriter consumer port wired at apps/cli/_cross_context.py per D17. Substrate for Phase 2 UX run rendering, citation surface fetch, and run listing per D93."
requires-python = ">=3.14"
# SQLAlchemy + asyncpg arrive at S31 commit 4 alongside the
# Postgres adapter per D30's per-context dep-scoping invariant.
# Mirrors the agent context's adapter scope (S24 commit 7):
# sqlalchemy[asyncio] for the AsyncEngine + Core query surface,
# asyncpg as the driver. Domain code is pure per D16; the deps
# live here because the adapter declares them.
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[tool.uv]
package = false
