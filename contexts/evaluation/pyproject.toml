[project]
name = "padhanam-evaluation"
version = "0.0.0"
description = "Evaluation bounded context (D53). Scoring sheet primitive, applier port, rubric_application records. S16 lands the foundations: domain entities, per-tenant migration, exact-match deterministic applier, apply-scoring-sheet use case."
requires-python = ">=3.14"
# S16: SQLAlchemy + asyncpg enter the evaluation manifest with the
# Postgres rubric-application repository adapter (commit 4). Domain
# code is unaffected (D16: domain is pure); the adapter declares them
# here so D30's per-context dep-scoping invariant holds.
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[tool.uv]
package = false
