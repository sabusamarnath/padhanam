services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:494dff7e67e7bc2c826b94c331364978d145ebb86fd338154138b084223b7f67
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Tenancy Postgres instances (P3/S9). Three new services share the P1
  # postgres digest (single image reference, three service definitions —
  # same image-cache hit, single supply-chain surface). Each has its own
  # internal volume; no host port binding (S5 rule).
  #
  # postgres-control-plane hosts the tenant registry and any other
  # operator-owned, jurisdiction-spanning data (D33). It is operationally
  # separate from tenant data planes and never co-located with one.
  #
  # postgres-tenant-a and postgres-tenant-b are the two test-set tenant
  # data planes (D32). Each hosts a single tenant's schema once S11
  # lands the per-tenant migration runner. Adding tenants beyond these
  # two in P3 requires editing this file; instance-creation-as-config
  # lands when production deployment context arrives.
  postgres-control-plane:
    image: pgvector/pgvector:pg17@sha256:494dff7e67e7bc2c826b94c331364978d145ebb86fd338154138b084223b7f67
    # Loopback-only host port binding so the S10 contract tests run
    # from `uv run pytest` on the laptop. This is a deliberate
    # exception to the S5 "only Caddy binds host ports" rule, scoped
    # to dev: control-plane needs host reachability for the
    # integration test path that the S9 instance addition created. The
    # binding is loopback-only (127.0.0.1) so external network does
    # not see it; production manifests remove the binding entirely.
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_CONTROL_PLANE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CONTROL_PLANE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CONTROL_PLANE_DB}
    volumes:
      - postgres_control_plane_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres-tenant-a:
    image: pgvector/pgvector:pg17@sha256:494dff7e67e7bc2c826b94c331364978d145ebb86fd338154138b084223b7f67
    environment:
      POSTGRES_USER: ${POSTGRES_TENANT_A_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TENANT_A_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TENANT_A_DB}
    volumes:
      - postgres_tenant_a_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres-tenant-b:
    image: pgvector/pgvector:pg17@sha256:494dff7e67e7bc2c826b94c331364978d145ebb86fd338154138b084223b7f67
    environment:
      POSTGRES_USER: ${POSTGRES_TENANT_B_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TENANT_B_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TENANT_B_DB}
    volumes:
      - postgres_tenant_b_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Shared Neo4j 5 Community (P6/S21, D63). One instance for all
  # tenants; isolation is property-based (every :Entity node and every
  # relationship carries `tenant_id`) and structurally gated by the
  # TenantScopedNeo4jSession wrapper at
  # contexts/ingestion/adapters/outbound/neo4j/. Explicit deviation
  # from D32's per-instance Postgres posture, with reasoning in D63;
  # production-deployment context may revisit per the deferred-
  # decisions entry.
  #
  # No host port binding (S5 rule); the GraphRepository adapter and
  # the ops.migrate_neo4j runner reach bolt at neo4j://padhanam-neo4j:7687
  # over the Compose network. Operator Cypher access via
  # `make neo4j-shell` (cypher-shell exec inside the container).
  padhanam-neo4j:
    image: neo4j:5-community@sha256:b357872da95a164c5243ca8d9060601130717ff43cee3c829402fab46209a412
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      # Conservative dev memory profile. Defaults are Neo4j-tuned
      # but explicit values keep the dev footprint predictable
      # alongside the existing Postgres + ClickHouse + Ollama
      # services. Production deployments retune via configuration.
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Langfuse stack (P2/S4). Six services total: this langfuse-db (Postgres for metadata),
  # clickhouse (trace data plane), minio (S3-compatible blob store), langfuse-web (UI+API),
  # langfuse-worker (async ingestion), and the existing redis above (shared with Padhanam
  # via DB number per D18 — Padhanam uses DB 0, Langfuse uses DB 1).

  langfuse-db:
    image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_DB_NAME}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.12@sha256:a65ca89ddbe8e04a05036dd7d7110a203256293b407b9359130ed5e4333f45ff
    user: "101:101"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:a342898b433b4df054f20209980e58607f90a6ead4993424832597c65371648a
    entrypoint: sh
    # MinIO maps top-level dirs in /data to buckets. Create the langfuse bucket here;
    # Langfuse uses prefixes (events/, media/) within the single bucket.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3.172.0@sha256:f04ea6d821ee45bdd4f1a76ff562a54e32e70fbb8d51a3621d1bb7bdef886b66
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/${LANGFUSE_DB_NAME}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_URL: https://langfuse.localhost
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3.172.0@sha256:ca36177abd02905d750056aa9029263a93736c1bd85471a6de820f5ca989ca99
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/${LANGFUSE_DB_NAME}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # LiteLLM (P2/S6). OpenAI-compatible gateway in front of Ollama (D4).
  # OTel emission to Langfuse via OTLP/HTTP per D27 — the Langfuse Python
  # SDK is deliberately not in the callbacks list. Auth header is
  # derived from the existing Langfuse keys via ops/derive_env.py and
  # arrives as ${LITELLM_OTEL_HEADERS} from .env.derived; OTEL_HEADERS is
  # comma-separated key=value with values URL-encoded per the OTel spec.
  # No host port binding (S5 rule); make smoke-llm reaches /v1/chat/...
  # by exec-ing into the caddy container (which has wget) and hitting
  # http://litellm:4000 on the internal network.
  litellm:
    image: ghcr.io/berriai/litellm:v1.83.10-stable@sha256:6c82d338a60e7b273ae46bf1d8db814d2856ae010f96c44eeadde574d3893f76
    depends_on:
      ollama:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_LOG: WARNING
      # S48a: OpenAI credentials passthrough so the gateway can route the
      # gpt-4o-mini REAL_TIME_REQUIRED-tier pin. Empty when the operator
      # has not set OPENAI_API_KEY; the gateway rejects gpt-4o-mini calls
      # in that state with a clear AuthenticationError surfaced through
      # the inference adapter's InferenceConfigurationError translation.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://langfuse-web:3000/api/public/otel/v1/traces
      OTEL_HEADERS: ${LITELLM_OTEL_HEADERS}
      OTEL_SERVICE_NAME: litellm
    volumes:
      - ./ops/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness'); sys.exit(0)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # Ollama (P2/S6). Local LLM runtime; LiteLLM reaches it on the internal
  # Compose network at http://ollama:11434. No host port binding (D25 / S5
  # network-exposure rule). Default model is qwen2.5:7b per D15 and is
  # pulled into ollama_data via `make pull-model`; the volume persists the
  # ~5GB blob across `make up`/`make down` cycles. OLLAMA_HOST=0.0.0.0:11434
  # is required because the daemon defaults to 127.0.0.1 (loopback-only
  # inside the container) and would not be reachable from sibling services.
  ollama:
    image: ollama/ollama:0.22.0@sha256:05ab093b257a54318fba39293f1640d53b507d1edec8fa6ca2d3e1817c02e53b
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ollama_data:/root/.ollama
    # Memory ceiling sized for Qwen 2.5 7B at Ollama's default q4 quantization
    # (~5GB resident) plus KV cache and runtime overhead. Docker Desktop's VM
    # memory allocation must be at least this large for the limit to be real.
    mem_limit: 12g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # Padhanam FastAPI application (P2/S7). Eleventh service in the stack.
  # Hexagonal layers + bounded contexts are loaded as workspace members
  # (D30); the image is built from apps/api/Dockerfile at the repo root
  # so the build context sees padhanam/, contexts/, shared_kernel/, and
  # apps/. No host port binding (S5 rule); Caddy reverse-proxies on the
  # internal Compose network at /api/*.
  #
  # The image tag floats during dev iteration but is digest-pinned for
  # `make scan` and the security review checklist; rebuild with
  # `docker compose build padhanam-api` and refresh the digest after.
  # The build:context: form is the development-mode default; the
  # production manifest replaces this with an upstream-image digest pin.
  padhanam-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: padhanam-api:dev@sha256:b69c6e0b7b45902d31d256345931169302d83e12782fc9757fe21ab226da1bb3
    depends_on:
      litellm:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
      padhanam-neo4j:
        condition: service_healthy
    # Loopback-only host-port binding for webhook smoke testing
    # (P13/S45, D129). Twilio inbound WhatsApp webhooks reach the API
    # through an ngrok tunnel to host port 8000; uvicorn serves the
    # messaging routes directly, because Caddy's `handle_path /api/*`
    # strips the prefix and the messaging router registers at the full
    # /api/v1/messaging/* path — so the webhook tunnel bypasses Caddy.
    # A deliberate dev-only exception to the S5 "only Caddy binds host
    # ports" rule, scoped to 127.0.0.1 (not exposed beyond the host) —
    # the same shape as postgres-control-plane's loopback binding.
    # Production manifests remove this binding.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PADHANAM_PROFILE: dev
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      # Tenancy: control-plane connection details (D33). Read by
      # ControlPlaneSettings in padhanam/config/tenancy.py for the
      # registry adapter and the alembic env.py.
      POSTGRES_CONTROL_PLANE_USER: ${POSTGRES_CONTROL_PLANE_USER}
      POSTGRES_CONTROL_PLANE_PASSWORD: ${POSTGRES_CONTROL_PLANE_PASSWORD}
      POSTGRES_CONTROL_PLANE_DB: ${POSTGRES_CONTROL_PLANE_DB}
      # Per-tenant connection details (D32). Read by
      # TenantPostgresSettings.for_tenant(label) so ops.seed_tenants
      # can construct plaintext TenantConnectionConfigs at registration
      # time. Production removes this passthrough — registry rows are
      # the source of truth post-seeding (D36).
      POSTGRES_TENANT_A_USER: ${POSTGRES_TENANT_A_USER}
      POSTGRES_TENANT_A_PASSWORD: ${POSTGRES_TENANT_A_PASSWORD}
      POSTGRES_TENANT_A_DB: ${POSTGRES_TENANT_A_DB}
      POSTGRES_TENANT_B_USER: ${POSTGRES_TENANT_B_USER}
      POSTGRES_TENANT_B_PASSWORD: ${POSTGRES_TENANT_B_PASSWORD}
      POSTGRES_TENANT_B_DB: ${POSTGRES_TENANT_B_DB}
      # Shared Neo4j connection (S21, D63). Read by Neo4jSettings in
      # padhanam/config/graph.py for the GraphRepository adapter, the
      # tenant-scoped session wrapper, and the ops.migrate_neo4j Cypher
      # migration runner.
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Messaging: Twilio WhatsApp delivery (P13/S45, D119, D129). Read
      # by MessagingSettings in padhanam/config/messaging.py;
      # build_messaging_composition selects the Twilio or LocalEcho
      # adapter from MESSAGING_ADAPTER. Values resolve from .env.
      MESSAGING_ADAPTER: ${MESSAGING_ADAPTER}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      # S47 smoke override: qwen2.5:14b's warm latency on the cell's
      # intent-extraction prompt (system + JSON schema + user message)
      # exceeds the 30s REAL_TIME_REQUIRED default. Surfaced live at
      # smoke time. Captured for follow-up: the tier-budget config
      # may need a Phase 2-A bump or a per-model override surface.
      REAL_TIME_REQUIRED_TIMEOUT_SECONDS: ${REAL_TIME_REQUIRED_TIMEOUT_SECONDS:-30}
      # Inbound webhook (P13/S45, D129). The Twilio WhatsApp webhook
      # receiver synthesises an operator ActorContext for the
      # configured tenant; WEBHOOK_URL is the public URL Twilio signs
      # against, used for X-Twilio-Signature verification.
      WEBHOOK_TENANT_ID: ${WEBHOOK_TENANT_ID}
      WEBHOOK_JURISDICTION: ${WEBHOOK_JURISDICTION}
      WEBHOOK_URL: ${WEBHOOK_URL}
      # Calendar: Nango Proxy reach + auth (P15/S55a, D148). Read by
      # CalendarSettings in padhanam/config/calendar.py for the
      # NangoProxyCalendarAdapter. NANGO_BASE_URL is the URL Padhanam uses
      # to reach the Proxy; NANGO_SECRET_KEY is the dashboard secret key
      # used as the Proxy bearer token. Values resolve from .env.
      NANGO_BASE_URL: ${NANGO_BASE_URL}
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health'); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # Nango self-hosted (Nango provisioning session, prerequisite to S55
  # calendar). Separate tool-service per D14: Padhanam consumes it over
  # HTTP from the calendar context (S55) and email context (S56); no
  # vendor SDK enters domain code. Free self-hosting scope is Auth +
  # Proxy only — Syncs, Functions, and Webhooks are Enterprise — which is
  # why the calendar plan is pull-on-demand via Proxy (see
  # charter/deferred-decisions.md "Calendar tool service" and the
  # 2026-05-28 calendar-retrieval-design captures entry). Reconciled
  # against the upstream compose (NangoHQ/nango master) and Docker Hub at
  # 2026-05-28; the upstream `nango` network, the providers.yaml source
  # mount, and the optional nango-redis are dropped (see below).
  #
  # Port gotcha (NangoHQ/nango issue #5305, 2026-01-24): the published
  # image bakes PORT=8080 and resolves SERVER_PORT -> PORT -> 3003, so a
  # naive 3003:3003 mapping leaves the server listening on 8080 and
  # unreachable. Resolved by setting SERVER_PORT explicitly so the server
  # listens on the same port the mapping publishes.
  #
  # No Caddy route and no Elasticsearch: the dashboard and the drop-in
  # OAuth Connect UI are reached by the operator over a loopback-only host
  # binding (the S5-rule dev exception, same shape as
  # postgres-control-plane and padhanam-api), and NANGO_LOGS_ENABLED=false
  # sends logs to stdout so the optional Elasticsearch service is omitted.
  # Redis is omitted too: the free Auth+Proxy server config references no
  # Redis env (the upstream nango-redis serves Enterprise sync/
  # orchestration, out of scope). Production swaps nango-db for an
  # external managed Postgres per local-first.
  nango-db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: ${NANGO_DB_USER}
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD}
      POSTGRES_DB: ${NANGO_DB_NAME}
    volumes:
      - nango_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nango-server:
    image: nangohq/nango-server:hosted-0.70.5@sha256:12f35eb47c0b73c071a72bf8cc476b7b992898cda89addfb26a8ef6b09327938
    # Published image is linux/amd64 only; runs under emulation on Apple
    # Silicon / ARM (the runbook warns the operator).
    platform: linux/amd64
    depends_on:
      nango-db:
        condition: service_healthy
    # Loopback-only host binding (S5-rule dev exception, scoped to
    # 127.0.0.1): the operator's browser reaches the dashboard on
    # SERVER_PORT and the OAuth Connect UI on CONNECT_UI_PORT to establish
    # the Google Calendar connection. Production removes these bindings.
    ports:
      - "127.0.0.1:${SERVER_PORT:-3003}:${SERVER_PORT:-3003}"
      - "127.0.0.1:${CONNECT_UI_PORT:-3009}:${CONNECT_UI_PORT:-3009}"
    environment:
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}
      NANGO_DB_USER: ${NANGO_DB_USER}
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD}
      NANGO_DB_HOST: nango-db
      NANGO_DB_NAME: ${NANGO_DB_NAME}
      NANGO_DB_PORT: "5432"
      NANGO_DB_SSL: "false"
      RECORDS_DATABASE_URL: postgresql://${NANGO_DB_USER}:${NANGO_DB_PASSWORD}@nango-db:5432/${NANGO_DB_NAME}
      # Port-gotcha resolution (#5305): SERVER_PORT overrides the image's
      # baked PORT=8080 so the server listens on the published port.
      SERVER_PORT: ${SERVER_PORT:-3003}
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:3003}
      NANGO_PUBLIC_SERVER_URL: ${NANGO_PUBLIC_SERVER_URL:-http://localhost:3003}
      CONNECT_UI_PORT: ${CONNECT_UI_PORT:-3009}
      FLAG_SERVE_CONNECT_UI: "true"
      # Dashboard auth. FLAG_AUTH_ENABLED=false disables Nango's
      # email-based login/signup and, together with the dashboard
      # username/password, fronts the dashboard with HTTP Basic Auth
      # (the NangoHQ/nango .env.example convention). Setting it true
      # instead forces the email-account signup flow, which is wrong for
      # a single-operator loopback-only dev instance.
      FLAG_AUTH_ENABLED: "false"
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD}
      # Elasticsearch omitted; logs to stdout.
      NANGO_LOGS_ENABLED: "false"
      LOG_LEVEL: info
      # Not in the upstream compose; included for the project's
      # telemetry-off posture (harmless if the image ignores it).
      TELEMETRY: "false"
    # TCP-connect check on the resolved SERVER_PORT: path-independent and
    # uses node (the app runtime, guaranteed on PATH), so it does not
    # assume wget. It confirms exactly what #5305 breaks — the server
    # listening on the published port. The runbook does the richer HTTP
    # /health check from the host.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(Number(process.env.SERVER_PORT||3003),'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_control_plane_data:
  postgres_tenant_a_data:
  postgres_tenant_b_data:
  redis_data:
  caddy_data:
  caddy_config:
  langfuse_db_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  ollama_data:
  neo4j_data:
  neo4j_logs:
  nango_db_data:
