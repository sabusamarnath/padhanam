# Meta-classifier five-way routing gold-set fixture (D137, D140, P15, S56b).
#
# Operator-shaped inbounds paired with the cell each should route to,
# extending the S55b-2 four-way meta-classifier gold set to the fifth
# surface (email_conversation, D140 five-way extension at S56b). Scoped
# to email *queries* for the email route — the email surface is read-only
# (D151), so send/reply phrasings are not part of the routing gold set
# (they route to email_conversation and the cell returns unclear_email;
# that read-only boundary is exercised at the cell's own gold set).
#
# Uses the dispatch_classifier surface (the runner's META_CLASSIFIER
# schema + prompt, now five-way). The deliberately ambiguous entries
# carry their best-guess identifier per the S48b reflection-2 recurrence
# test; the expected production behaviour on genuine ambiguity is the
# D140 Step 5 low-confidence routing to dispatch_clarification, not a
# confident misclassification. Two new entries sit in the tighter
# email/calendar band ("anything from the board", "did the board confirm")
# where inbox-arrival and meeting-schedule readings genuinely compete.

name: meta_classifier_five_way_p15_s56b
intent_surface: dispatch_classifier
entries:
  # ----- manual_entry (4) -----
  - input_phrasing: "Add a data point for Q3 revenue: 5M"
    expected_intent_class: manual_entry
  - input_phrasing: "Create a new case for the Acme deal"
    expected_intent_class: manual_entry
  - input_phrasing: "Note that the partnership review slipped to next month"
    expected_intent_class: manual_entry
  - input_phrasing: "Start tracking my hiring pipeline"
    expected_intent_class: manual_entry

  # ----- audit_conversation (4) -----
  - input_phrasing: "Show me the audit history for the Q3 review case"
    expected_intent_class: audit_conversation
  - input_phrasing: "What happened with the marketing deck last week?"
    expected_intent_class: audit_conversation
  - input_phrasing: "audit log for the Acme deal"
    expected_intent_class: audit_conversation
  - input_phrasing: "Who changed the revenue figure and when?"
    expected_intent_class: audit_conversation

  # ----- mirror_conversation (4) -----
  - input_phrasing: "Show me the Q3 portfolio review"
    expected_intent_class: mirror_conversation
  - input_phrasing: "List my open cases"
    expected_intent_class: mirror_conversation
  - input_phrasing: "Drill down into the children of the Acme case"
    expected_intent_class: mirror_conversation
  - input_phrasing: "What's the current status of the partnership review?"
    expected_intent_class: mirror_conversation

  # ----- calendar_conversation (5, query-scoped) -----
  - input_phrasing: "What's on my calendar today?"
    expected_intent_class: calendar_conversation
  - input_phrasing: "Do I have any meetings with Ada this week?"
    expected_intent_class: calendar_conversation
  - input_phrasing: "When is the board sync?"
    expected_intent_class: calendar_conversation
  - input_phrasing: "What's my next meeting?"
    expected_intent_class: calendar_conversation
  - input_phrasing: "Am I free tomorrow afternoon?"
    expected_intent_class: calendar_conversation

  # ----- email_conversation (5, query-scoped) -----
  - input_phrasing: "What email came in today?"
    expected_intent_class: email_conversation
  - input_phrasing: "Did I get an email from Priya?"
    expected_intent_class: email_conversation
  - input_phrasing: "Find the message about the board pack"
    expected_intent_class: email_conversation
  - input_phrasing: "What's the latest in my inbox?"
    expected_intent_class: email_conversation
  - input_phrasing: "Any unread messages from the bank?"
    expected_intent_class: email_conversation

  # ----- deliberately ambiguous (6) -----
  # Best-guess identifier recorded; production routes these to
  # dispatch_clarification at low confidence (D140 Step 5). The last two
  # sit in the tighter email/calendar band the fifth surface introduces.
  - input_phrasing: "Tell me about revenue"
    expected_intent_class: mirror_conversation
  - input_phrasing: "the Acme deal"
    expected_intent_class: mirror_conversation
  - input_phrasing: "update on the board"
    expected_intent_class: calendar_conversation
  - input_phrasing: "what's next"
    expected_intent_class: calendar_conversation
  - input_phrasing: "anything from the board"
    expected_intent_class: email_conversation
  - input_phrasing: "did the board confirm"
    expected_intent_class: email_conversation
