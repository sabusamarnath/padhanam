# LiteLLM proxy configuration.
#
# OTel emission is enabled via the "otel" callback (D27). The Langfuse
# Python SDK is intentionally absent from the callbacks list — the trace
# path is Padhanam -> LiteLLM -> OTLP -> Langfuse, not Padhanam ->
# LiteLLM -> Langfuse SDK -> Langfuse. OTLP exporter wiring (endpoint,
# headers, protocol) is configured via OTEL_* env vars on the container,
# populated from padhanam/config/ at compose-up time (see ops/derive_env.py
# and the litellm service block in compose.yaml).
#
# The master key is read from LITELLM_MASTER_KEY which lives in .env and
# is validated by InferenceSettings (D19). The model_list pins the
# default development model (D15) at the local Ollama instance reachable
# on the Compose-internal network.

model_list:
  - model_name: qwen2.5:7b
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://ollama:11434
  # S47 / D133: qwen2.5:14b is the REAL_TIME_REQUIRED-tier default
  # per padhanam/config/inference.py and the model registry at
  # padhanam/config/model_registry.py. The gateway must route to it
  # for the manual entry cell's intent-extraction calls to land.
  - model_name: qwen2.5:14b
    litellm_params:
      model: ollama_chat/qwen2.5:14b
      api_base: http://ollama:11434
  # S20 / D62: nomic-embed-text:v1.5 embedding model served via
  # Ollama. The model_info.mode flag tells the proxy this entry
  # routes to the embeddings API rather than the chat API; client
  # callers (the LiteLLM SDK in the ingestion embedder adapter) hit
  # /v1/embeddings against the gateway and receive 768-dim vectors.
  # The :v1.5 tag is pinned explicitly rather than relying on
  # ``latest`` so the model card requirements (search_document:
  # corpus prefix, 768-dim native output) hold under Ollama tag
  # drift.
  - model_name: nomic-embed-text:v1.5
    litellm_params:
      model: ollama/nomic-embed-text:v1.5
      api_base: http://ollama:11434
    model_info:
      mode: embedding

litellm_settings:
  callbacks: ["otel"]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
